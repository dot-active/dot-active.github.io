<title>Dial Piano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Sora:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow phone-shaped column. Screen on top (with a live waveform), the keypad is the instrument, the octave bar sits under the thumb.
   Colour logic: every note owns a hue (--h, one step of the colour wheel per semitone); a pressed key lights up in its hue
   and the screen + background aura follow the last note (--lh). Dark keys = sharps, cyan-tinted = high notes, faint = held modifiers. */
@property --lh{syntax:'<number>';inherits:true;initial-value:260}
:root{
  --f-ui:"Sora","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-lcd:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --bg:#EFECF8; --ink:#17131F; --muted:#6B6782; --line:rgba(40,24,90,.10); --panel:rgba(255,255,255,.55);
  --hl:rgba(255,255,255,.95);
  --nat:rgba(255,255,255,.72); --nat-ink:#17131F;
  --shp:rgba(26,20,44,.88); --shp-ink:#F3F0FF;
  --hi:rgba(214,244,255,.78); --hi-ink:#0C3442;
  --mod:rgba(255,255,255,.32); --mod-ink:#3F3A55;
  --screen:#0E0B18; --screen-ink:#F5F2FF; --screen-dim:#8984A6; --screen-line:rgba(255,255,255,.09);
  --accent:#7B5CFF; --accent-2:#FF3D8B; --accent-ink:#FFFFFF;
  --blob-o:.55; --glow-l:58%;
  --shadow-c:rgba(50,24,120,.22);
  --lh:260;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07060D; --ink:#F1EEFA; --muted:#8D89A6; --line:rgba(255,255,255,.09); --panel:rgba(255,255,255,.05);
    --hl:rgba(255,255,255,.12);
    --nat:rgba(255,255,255,.075); --nat-ink:#F3F0FF;
    --shp:rgba(0,0,0,.5); --shp-ink:#C9C3E3;
    --hi:rgba(45,226,230,.12); --hi-ink:#CFFBFF;
    --mod:rgba(255,255,255,.025); --mod-ink:#ADA8C6;
    --screen:rgba(12,10,22,.78); --screen-line:rgba(255,255,255,.08);
    --accent:#8B70FF; --accent-2:#FF4D95;
    --blob-o:.42; --glow-l:62%;
    --shadow-c:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07060D; --ink:#F1EEFA; --muted:#8D89A6; --line:rgba(255,255,255,.09); --panel:rgba(255,255,255,.05);
  --hl:rgba(255,255,255,.12);
  --nat:rgba(255,255,255,.075); --nat-ink:#F3F0FF;
  --shp:rgba(0,0,0,.5); --shp-ink:#C9C3E3;
  --hi:rgba(45,226,230,.12); --hi-ink:#CFFBFF;
  --mod:rgba(255,255,255,.025); --mod-ink:#ADA8C6;
  --screen:rgba(12,10,22,.78); --screen-line:rgba(255,255,255,.08);
  --accent:#8B70FF; --accent-2:#FF4D95;
  --blob-o:.42; --glow-l:62%;
  --shadow-c:rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--f-ui); -webkit-text-size-adjust:100%;
  padding-block:12px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
.app{position:relative; z-index:1; max-width:440px; margin:0 auto; display:flex; flex-direction:column; gap:14px; min-height:calc(100dvh - 36px); justify-content:center}

/* Background aura: three drifting colour blobs + one that takes the hue of the last note */
.aura{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.aura i,.aura b{position:absolute; border-radius:50%; filter:blur(70px); opacity:var(--blob-o)}
.aura i:nth-child(1){width:60vmax; height:60vmax; left:-20vmax; top:-22vmax; background:#7B5CFF}
.aura i:nth-child(2){width:50vmax; height:50vmax; right:-18vmax; top:20vh; background:#FF3D8B}
.aura i:nth-child(3){width:55vmax; height:55vmax; left:10vw; bottom:-30vmax; background:#16C7D9}
.aura b{width:70vmin; height:70vmin; left:50%; top:62%; margin:-35vmin 0 0 -35vmin; background:hsl(var(--lh) 95% 60%); opacity:0; transition:--lh .35s}
@media (prefers-reduced-motion:no-preference){
  .aura i:nth-child(1){animation:drift1 22s ease-in-out infinite alternate}
  .aura i:nth-child(2){animation:drift2 26s ease-in-out infinite alternate}
  .aura i:nth-child(3){animation:drift3 30s ease-in-out infinite alternate}
  .aura b.pulse{animation:pulse .9s ease-out}
  @keyframes drift1{to{transform:translate(18vw,14vh) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-22vw,-10vh) scale(.85)}}
  @keyframes drift3{to{transform:translate(-12vw,-18vh) scale(1.1)}}
  @keyframes pulse{0%{opacity:calc(var(--blob-o) * 1.1);transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
}

/* Screen */
.lcd{
  position:relative; overflow:hidden; isolation:isolate;
  background:var(--screen); color:var(--screen-ink); border-radius:26px; padding:14px 16px 12px;
  font-family:var(--f-lcd);
  -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 0 0 1px var(--screen-line), inset 0 1px 0 rgba(255,255,255,.08), 0 24px 50px -24px var(--shadow-c);
  user-select:none; -webkit-user-select:none;
  transition:--lh .35s;
}
.lcd::before{
  content:""; position:absolute; z-index:-1; width:110%; aspect-ratio:1; left:-5%; top:-70%;
  background:radial-gradient(closest-side,hsl(var(--lh) 95% 60% / .38),transparent 72%);
}
.lcd canvas{position:absolute; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none}
.dial{min-height:1.3em; margin-right:40px; font-size:.9rem; letter-spacing:.22em; color:var(--screen-dim); white-space:nowrap; overflow:hidden}
.note{
  font-size:2.7rem; line-height:1.12; min-height:1.12em; font-weight:800; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transform-origin:0 60%;
  background:linear-gradient(95deg,hsl(var(--lh) 100% 76%),hsl(calc(var(--lh) + 60) 100% 72%));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.note.dim{background:none; color:var(--screen-dim); font-weight:600}
.note.many{font-size:1.45rem; line-height:1.95}
@media (prefers-reduced-motion:no-preference){
  .note.pop{animation:pop .38s cubic-bezier(.2,.9,.25,1.4)}
  @keyframes pop{from{transform:scale(1.22) translateY(-2px); filter:blur(3px); opacity:.4}}
}
.lcdhint{min-height:1.4em; font-size:.66rem; color:var(--screen-dim); margin-top:7px}
.lcdhint #prog{color:var(--screen-ink)}
.gear{
  position:absolute; top:8px; right:8px; width:36px; height:36px; display:grid; place-items:center;
  border:0; border-radius:12px; background:transparent; color:var(--screen-ink); cursor:pointer; padding:0;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; transition:background .2s;
}
.gear:hover{background:rgba(255,255,255,.1)}
.gear:focus-visible{outline:2px solid var(--screen-ink); outline-offset:-2px}
.gear svg{width:20px; height:20px; transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
.gear:hover svg{transform:rotate(90deg)}

/* Settings sheet */
dialog.sheet{
  width:min(440px,calc(100vw - 32px)); max-height:calc(100dvh - 32px); overflow:auto;
  margin:auto; padding:0; border:0; border-radius:26px;
  background:color-mix(in srgb,var(--bg) 82%,transparent); color:var(--ink);
  -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 30px 70px -20px var(--shadow-c), 0 0 0 1px var(--line), inset 0 1px 0 var(--hl);
}
dialog.sheet::backdrop{background:rgba(8,6,18,.4); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px)}
@media (prefers-reduced-motion:no-preference){
  dialog.sheet[open]{animation:sheetIn .32s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes sheetIn{from{opacity:0; transform:translateY(16px) scale(.97)}}
}
.sheet-h{display:flex; align-items:center; justify-content:space-between; padding:14px 12px 4px 20px}
.sheet-h h2{margin:0; font-size:1.05rem; font-weight:700; letter-spacing:.04em}
.sheet-b{display:flex; flex-direction:column; gap:14px; padding:8px 20px 20px}
.xbtn{font:inherit; font-size:1.2rem; line-height:1; width:36px; height:36px; border:0; border-radius:12px; background:transparent; color:var(--muted); cursor:pointer}
.xbtn:hover{background:var(--panel)}

/* Settings */
.ctrl{display:flex; flex-direction:column; gap:10px}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.lbl{font-size:.76rem; color:var(--muted); min-width:2.8em}
.chip{
  font:inherit; font-size:.84rem; font-weight:600; padding:6px 14px; min-height:36px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; touch-action:manipulation;
  transition:transform .15s,background .2s,box-shadow .2s;
}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{
  background:linear-gradient(110deg,var(--accent),var(--accent-2)); color:var(--accent-ink); border-color:transparent;
  box-shadow:0 6px 18px -8px var(--accent-2);
}
.hint{margin:0; font-size:.8rem; color:var(--muted)}
select{font:inherit; font-size:.84rem; padding:6px 12px; min-height:36px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink)}
input[type="range"]{accent-color:var(--accent); flex:1; min-width:0}
input[type="checkbox"]{accent-color:var(--accent); width:18px; height:18px; margin:0}
.sw{display:flex; align-items:center; gap:8px; font-size:.9rem; cursor:pointer}
.status{font-size:.78rem; color:var(--muted); min-width:0; flex:1}
.extras{display:flex; flex-direction:column; gap:12px; padding:12px 14px; background:var(--panel); border-radius:18px; box-shadow:inset 0 0 0 1px var(--line)}

/* Keypad */
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; touch-action:none}
.key{
  --h:260;
  position:relative; overflow:hidden; isolation:isolate;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:clamp(64px,11vh,96px); border:0; border-radius:22px; padding:0;
  background:var(--kb); color:var(--ki); font:inherit;
  -webkit-backdrop-filter:blur(12px) saturate(150%); backdrop-filter:blur(12px) saturate(150%);
  box-shadow:inset 0 0 0 1px var(--line), inset 0 1px 0 var(--hl), 0 12px 24px -16px var(--shadow-c);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; cursor:pointer;
  transition:transform .28s cubic-bezier(.2,.9,.3,1.6), box-shadow .3s, background .3s, color .2s;
}
/* note-colour light strip */
.key::after{
  content:""; position:absolute; left:34%; right:34%; bottom:8px; height:3px; border-radius:3px;
  background:hsl(var(--h) 95% var(--glow-l)); box-shadow:0 0 10px hsl(var(--h) 95% var(--glow-l));
  opacity:.75; transition:opacity .2s, left .25s, right .25s;
}
.key .d,.key .s{position:relative; z-index:1}
.key .d{font-size:1.9rem; font-weight:700; line-height:1}
.key .s{font-family:var(--f-lcd); font-size:.7rem; letter-spacing:.06em; min-height:1.1em; opacity:.75}
.key.nat{--kb:var(--nat); --ki:var(--nat-ink)}
.key.shp{--kb:var(--shp); --ki:var(--shp-ink)}
.key.hi{--kb:var(--hi); --ki:var(--hi-ink)}
.key.mod{--kb:var(--mod); --ki:var(--mod-ink); box-shadow:inset 0 0 0 1px var(--line), 0 0 0 0 transparent}
.key.mod::after{display:none}
.key:hover::after{left:26%; right:26%; opacity:1}
.key.down{
  background:linear-gradient(140deg,hsl(var(--h) 95% 62%),hsl(calc(var(--h) + 45) 95% 56%));
  color:#fff; transform:scale(.93);
  box-shadow:inset 0 0 0 1px hsl(var(--h) 100% 80% / .55), 0 0 26px -2px hsl(var(--h) 95% 60% / .75), 0 0 64px -8px hsl(var(--h) 95% 60% / .55);
  transition-duration:.06s;
}
.key.down::after{opacity:0}
.key.down .s{opacity:1}
.key.mod.down{background:linear-gradient(140deg,var(--accent),var(--accent-2))}
.key.target{box-shadow:inset 0 0 0 2px hsl(var(--h) 95% var(--glow-l)), 0 0 22px -4px hsl(var(--h) 95% 60%)}
.key:focus-visible,.chip:focus-visible,.octbtn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .key.target:not(.down){animation:beckon 1.1s ease-in-out infinite}
  @keyframes beckon{50%{transform:scale(1.04)}}
}

/* press effects */
.rip{
  position:absolute; z-index:0; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);
  animation:rip .6s ease-out forwards;
}
@keyframes rip{from{transform:scale(0); opacity:1}to{transform:scale(10); opacity:0}}
.fx{position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden}
.fly{
  position:absolute; font:800 1.05rem var(--f-lcd); white-space:nowrap; transform:translate(-50%,-50%);
  color:hsl(var(--h) 100% var(--glow-l)); text-shadow:0 0 12px hsl(var(--h) 100% 60% / .8);
  animation:fly .9s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes fly{
  0%{opacity:0; transform:translate(-50%,-30%) scale(.6)}
  20%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx,0px)),-260%) scale(1.25)}
}

/* Octave bar */
.octbar{display:grid; grid-template-columns:1fr 1.35fr 1fr; gap:10px; align-items:stretch}
.octbtn{
  font:inherit; font-size:.92rem; font-weight:700; min-height:72px; border:0; border-radius:22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:var(--nat); color:var(--nat-ink); cursor:pointer; touch-action:none;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  box-shadow:inset 0 0 0 1px var(--line), inset 0 1px 0 var(--hl), 0 12px 24px -16px var(--shadow-c);
  -webkit-tap-highlight-color:transparent;
  transition:transform .28s cubic-bezier(.2,.9,.3,1.6), box-shadow .3s, background .3s;
}
.octbtn small{font-size:.66rem; font-weight:500; letter-spacing:.06em; opacity:.6}
.octbtn.held{
  background:linear-gradient(140deg,var(--accent),var(--accent-2)); color:var(--accent-ink); transform:scale(.95);
  box-shadow:0 0 28px -4px color-mix(in srgb,var(--accent-2) 75%,transparent); transition-duration:.06s;
}
.octbtn.held small{opacity:1}
.octsel{
  display:flex; flex-direction:column; justify-content:center; gap:6px; min-width:0;
  font-family:var(--f-lcd); text-align:center; cursor:ew-resize; touch-action:none;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; border-radius:18px;
}
.octsel:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.octcur{font-size:.7rem; color:var(--muted); line-height:1.2; white-space:nowrap}
.octcur b{font-size:1.3rem; color:var(--ink); font-weight:800; margin-right:4px}
.octsel.shifted .octcur b{background:linear-gradient(90deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.octrow{display:grid; grid-template-columns:repeat(5,1fr); gap:4px}
.octrow span{
  display:grid; place-items:center; height:30px; font-size:.78rem; border-radius:999px;
  color:var(--muted); background:var(--panel); box-shadow:inset 0 0 0 1px var(--line);
  transition:background .25s,color .25s,box-shadow .25s;
}
.octrow span.on{
  background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff;
  box-shadow:0 0 16px -2px color-mix(in srgb,var(--accent-2) 70%,transparent);
}
.octrow span.base:not(.on){box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.app[data-voice="dtmf"] .octbar{opacity:.4}

@media (prefers-reduced-motion:reduce){
  .key,.octbtn,.chip{transition:none}
  .rip,.fly{display:none}
}
</style>

<div class="aura" aria-hidden="true"><i></i><i></i><i></i><b id="pulse"></b></div>
<div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function(){
  var KEYS=['1','2','3','4','5','6','7','8','9','*','0','#'];
  var NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  var FLATS=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
  // original mapping: semitones above C for each key
  var ORIG={'1':0,'2':2,'3':4,'4':5,'5':7,'6':9,'7':11,'8':1,'9':3,'0':6,'*':8,'#':10};
  // sharp-key mapping: 1-7 natural, 8/9/0 = high 1/2/3 (next octave); * and # are held modifiers
  var NAT={'1':0,'2':2,'3':4,'4':5,'5':7,'6':9,'7':11,'8':12,'9':14,'0':16};
  var DTMF={'1':[697,1209],'2':[697,1336],'3':[697,1477],'4':[770,1209],'5':[770,1336],'6':[770,1477],
            '7':[852,1209],'8':[852,1336],'9':[852,1477],'*':[941,1209],'0':[941,1336],'#':[941,1477]};
  var LETTERS={'1':'','2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO','7':'PQRS','8':'TUV','9':'WXYZ','*':'','0':'','#':''};
  var SONGS={
    twinkle:['1','1','5','5','6','6','5','4','4','3','3','2','2','1'],
    ode:['3','3','4','5','5','4','3','2','1','1','2','3','3','2','2']
  };
  var HINTS={
    orig:'1–7 = do–si (light keys). 8 9 0 * # = C♯ D♯ F♯ G♯ A♯ (dark keys).',
    sharp:'1–7 = do–si. Hold * for ♯, hold # for ♭. 8 9 0 = high do re mi.',
    dtmf:'Real phone dial tones (DTMF): two tones per key, no musical pitch.'
  };

  function load(k,d){try{var v=localStorage.getItem('dialpiano.'+k);return v==null?d:v}catch(e){return d}}
  function save(k,v){try{localStorage.setItem('dialpiano.'+k,v)}catch(e){}}

  var state={mode:load('mode','orig'),voice:load('voice','piano'),oct:4,sharp:0,flat:0,dial:'',last:'',song:'',idx:0};
  // state.oct is the base octave (swipe / shake); the ▲▼ buttons only shift it while held
  var octHold={up:new Set(),dn:new Set()};
  if(state.mode!=='orig'&&state.mode!=='sharp')state.mode='orig';
  if(['piano','organ','chip','dtmf'].indexOf(state.voice)<0)state.voice='piano';

  var $=function(s){return document.querySelector(s)};
  var app=$('#app'),pad=$('#pad'),lcd=$('#lcd'),elDial=$('#dial'),elNote=$('#note'),elOct=$('#octrow'),
      elHint=$('#hint'),elSel=$('#octsel'),elCur=$('#octcur'),elProg=$('#prog'),elShakeSt=$('#shakeSt');

  /* ---------- audio ---------- */
  var ctx=null,master=null,analyser=null,wave=null;
  function ensureAudio(){
    try{
      if(!ctx){
        var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
        try{ctx=new AC({latencyHint:'interactive'})}catch(e){ctx=new AC()}
        var comp=ctx.createDynamicsCompressor();
        master=ctx.createGain(); master.gain.value=0.9;
        master.connect(comp); comp.connect(ctx.destination);
        try{analyser=ctx.createAnalyser();analyser.fftSize=1024;comp.connect(analyser);wave=new Uint8Array(analyser.fftSize)}catch(e){analyser=null}
      }
      if(ctx.state!=='running')ctx.resume();
    }catch(e){}
  }
  ['pointerup','touchend','click','keydown'].forEach(function(ev){document.addEventListener(ev,ensureAudio,{passive:true})});

  function mtof(m){return 440*Math.pow(2,(m-69)/12)}

  function startVoice(type,arg){
    var t=ctx.currentTime, out=ctx.createGain(), oscs=[], rel=0.1;
    out.gain.setValueAtTime(0,t); out.connect(master);
    function add(wave,f,g,dest,det){
      var o=ctx.createOscillator(); o.type=wave; o.frequency.setValueAtTime(f,t); if(det)o.detune.value=det;
      var gn=ctx.createGain(); gn.gain.value=g; o.connect(gn); gn.connect(dest); o.start(t); oscs.push(o);
    }
    if(type==='piano'){
      var f=mtof(arg), dur=Math.max(0.9,Math.min(3.4,3.4-(arg-48)*0.045));
      [[1,1],[2,0.5],[3,0.26],[4,0.14],[5,0.07]].forEach(function(p){add('sine',f*p[0]*(1+0.0005*p[0]*p[0]),p[1],out)});
      out.gain.linearRampToValueAtTime(0.17,t+0.004);
      out.gain.exponentialRampToValueAtTime(0.0008,t+dur);
      oscs.forEach(function(o){o.stop(t+dur+0.05)});
      rel=0.14;
    }else if(type==='organ'){
      var f2=mtof(arg), lp=ctx.createBiquadFilter();
      lp.type='lowpass'; lp.frequency.value=2600; lp.Q.value=0.6; lp.connect(out);
      add('triangle',f2,1,lp); add('sine',f2*2,0.35,lp); add('square',f2,0.12,lp,7); add('sine',f2/2,0.3,lp);
      out.gain.linearRampToValueAtTime(0.16,t+0.012); rel=0.12;
    }else if(type==='chip'){
      add('square',mtof(arg),1,out);
      out.gain.linearRampToValueAtTime(0.09,t+0.002); rel=0.03;
    }else{
      add('sine',arg[0],1,out); add('sine',arg[1],1,out);
      out.gain.linearRampToValueAtTime(0.11,t+0.004); rel=0.03;
    }
    return {out:out,oscs:oscs,rel:rel};
  }
  function stopVoice(v){
    try{
      var now=ctx.currentTime,p=v.out.gain;
      if(p.cancelAndHoldAtTime){p.cancelAndHoldAtTime(now)}
      else{var c=p.value;p.cancelScheduledValues(now);p.setValueAtTime(c,now)}
      p.setTargetAtTime(0,now,v.rel/3);
      var end=now+v.rel+0.08;
      v.oscs.forEach(function(o){try{o.stop(end)}catch(e){}});
      v.oscs[0].onended=function(){try{v.out.disconnect()}catch(e){}};
    }catch(e){}
  }

  /* ---------- notes ---------- */
  function semi(k){
    if(state.mode==='orig')return ORIG[k];
    return NAT[k]+(state.sharp>0?1:0)-(state.flat>0?1:0);
  }
  function preferFlat(){return state.flat>0&&state.sharp===0}
  function nameSemi(s){return (preferFlat()?FLATS:NAMES)[((s%12)+12)%12]}
  function nameMidi(m){return nameSemi(m)+(Math.floor(m/12)-1)}
  // one step round the colour wheel per semitone, so the same pitch class always glows the same colour
  function hueOf(k){
    var s=state.voice==='dtmf'?KEYS.indexOf(k)*7:(state.mode==='orig'?ORIG[k]:(k in NAT?semi(k):0));
    return (260+((s%12)+12)%12*30)%360;
  }

  /* ---------- visuals ---------- */
  var root=document.documentElement,fxLayer=$('#fx'),pulseEl=$('#pulse');
  var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function restart(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
  function sparkle(el,hue,label,pt){
    root.style.setProperty('--lh',hue);
    if(calm)return;
    restart(pulseEl,'pulse');
    var r=el.getBoundingClientRect(),x=pt?pt.x:r.left+r.width/2,y=pt?pt.y:r.top+r.height/2;
    var rp=document.createElement('span');rp.className='rip';
    rp.style.left=(x-r.left)+'px';rp.style.top=(y-r.top)+'px';
    rp.addEventListener('animationend',function(){rp.remove()});
    el.appendChild(rp);
    if(!label)return;
    var f=document.createElement('span');f.className='fly';f.textContent=label;
    f.style.setProperty('--h',hue);f.style.setProperty('--dx',(Math.random()*40-20).toFixed(0)+'px');
    f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+8)+'px';
    f.addEventListener('animationend',function(){f.remove()});
    fxLayer.appendChild(f);
  }

  /* ---------- keypad ---------- */
  var keyEl={},subEl={},downCount={};
  KEYS.forEach(function(k){
    var b=document.createElement('button');
    b.type='button'; b.className='key nat'; b.dataset.k=k;
    b.innerHTML='<span class="d"></span><span class="s"></span>';
    b.querySelector('.d').textContent=k;
    pad.appendChild(b); keyEl[k]=b; subEl[k]=b.querySelector('.s'); downCount[k]=0;
  });
  for(var n=2;n<=6;n++){var sp=document.createElement('span');sp.textContent=n;sp.dataset.o=n;elOct.appendChild(sp)}

  function refreshLabels(){
    var dtmf=state.voice==='dtmf';
    KEYS.forEach(function(k){
      var el=keyEl[k],cls,sub;
      if(dtmf){cls='nat';sub=LETTERS[k]}
      else if(state.mode==='orig'){cls='1234567'.indexOf(k)>=0?'nat':'shp';sub=NAMES[ORIG[k]]}
      else if(k==='*'){cls='mod';sub='♯ hold'}
      else if(k==='#'){cls='mod';sub='♭ hold'}
      else{var hiKey=(k==='8'||k==='9'||k==='0');cls=hiKey?'hi':'nat';sub=nameSemi(semi(k))+(hiKey?'↑':'')}
      el.classList.remove('nat','shp','hi','mod'); el.classList.add(cls);
      el.style.setProperty('--h',hueOf(k));
      subEl[k].textContent=sub;
      el.setAttribute('aria-label',k+(sub?' '+sub:''));
    });
    elHint.textContent=dtmf?HINTS.dtmf:HINTS[state.mode];
  }

  function curOct(){
    var d=(octHold.up.size?1:0)-(octHold.dn.size?1:0);
    return Math.max(2,Math.min(6,state.oct+d));
  }
  function refreshOct(){
    var o=curOct(),shifted=o!==state.oct;
    Array.prototype.forEach.call(elOct.children,function(s){
      s.classList.toggle('on',+s.dataset.o===o);
      s.classList.toggle('base',shifted&&+s.dataset.o===state.oct);
    });
    var f=mtof((o+1)*12);
    elSel.classList.toggle('shifted',shifted);
    elSel.setAttribute('aria-valuenow',String(state.oct));
    elSel.setAttribute('aria-valuetext','C'+state.oct);
    elCur.innerHTML='<b>C'+o+'</b>'+(state.voice==='dtmf'?'no pitch':(shifted?'hold':f.toFixed(1)+' Hz'));
    [['up','#octUp'],['dn','#octDn']].forEach(function(p){
      var b=$(p[1]),h=octHold[p[0]].size>0;
      b.classList.toggle('held',h); b.setAttribute('aria-pressed',String(h));
    });
  }
  function setOct(o){
    o=Math.max(2,Math.min(6,o));
    if(o===state.oct)return false;
    state.oct=o; refreshOct(); return true;
  }

  var active=new Map();
  function render(){
    elDial.textContent=state.dial.slice(-14)||' ';
    var names=[];
    active.forEach(function(e){if(!e.mod)names.push(e.nm)});
    if(names.length){elNote.textContent=names.join(' ');elNote.classList.remove('dim')}
    else if(state.last){elNote.textContent=state.last;elNote.classList.add('dim')}
    elNote.classList.toggle('many',names.length>3);
  }
  function setDown(k,d){
    downCount[k]=Math.max(0,downCount[k]+d);
    keyEl[k].classList.toggle('down',downCount[k]>0);
  }

  /* ---------- follow-along ---------- */
  function refreshFollow(){
    KEYS.forEach(function(k){keyEl[k].classList.remove('target')});
    var s=SONGS[state.song];
    if(!s){elProg.textContent='';return}
    var k=s[state.idx];
    keyEl[k].classList.add('target');
    elProg.textContent='▶ '+k+'  '+(state.idx+1)+'/'+s.length;
  }
  function followCheck(k){
    var s=SONGS[state.song]; if(!s)return;
    if(k===s[state.idx]){
      state.idx++;
      if(state.idx>=s.length){state.idx=0;refreshFollow();elProg.textContent='✓ Done — again!';return}
      refreshFollow();
    }
  }

  /* ---------- press / release ---------- */
  function press(k,id,pt){
    if(active.has(id))return;
    ensureAudio();
    var dtmf=state.voice==='dtmf';
    var isMod=!dtmf&&state.mode==='sharp'&&(k==='*'||k==='#');
    setDown(k,1);
    state.dial+=k;
    if(isMod){
      if(k==='*')state.sharp++; else state.flat++;
      active.set(id,{k:k,mod:true});
      refreshLabels(); render(); sparkle(keyEl[k],260,'',pt); return;
    }
    var entry={k:k};
    if(ctx&&master){
      if(dtmf){entry.voice=startVoice('dtmf',DTMF[k]);entry.nm=DTMF[k][0]+'+'+DTMF[k][1]}
      else{
        var midi=(curOct()+1)*12+semi(k);
        entry.voice=startVoice(state.voice,midi);
        entry.nm=nameMidi(midi);
      }
    }else{entry.nm=k}
    state.last=entry.nm;
    active.set(id,entry);
    if(navigator.vibrate){try{navigator.vibrate(6)}catch(e){}}
    followCheck(k);
    render();
    if(!calm)restart(elNote,'pop');
    sparkle(keyEl[k],hueOf(k),entry.nm,pt);
  }
  function releaseId(id){
    var en=active.get(id); if(!en)return;
    active.delete(id);
    setDown(en.k,-1);
    if(en.mod){
      if(en.k==='*')state.sharp=Math.max(0,state.sharp-1); else state.flat=Math.max(0,state.flat-1);
      refreshLabels();
    }else if(en.voice){stopVoice(en.voice)}
    render();
  }
  function releaseAll(){
    Array.from(active.keys()).forEach(releaseId);
    octHold.up.clear(); octHold.dn.clear(); refreshOct();
  }

  pad.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    var el=e.target.closest('.key'); if(!el)return;
    e.preventDefault();
    press(el.dataset.k,'p'+e.pointerId,{x:e.clientX,y:e.clientY});
    try{el.setPointerCapture(e.pointerId)}catch(err){}
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
    pad.addEventListener(ev,function(e){releaseId('p'+e.pointerId)});
  });
  pad.addEventListener('contextmenu',function(e){e.preventDefault()});

  document.addEventListener('keydown',function(e){
    if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
    if(dlg.open)return;
    var t=e.target; if(t&&/^(SELECT|INPUT|TEXTAREA)$/.test(t.tagName))return;
    if(KEYS.indexOf(e.key)>=0){e.preventDefault();press(e.key,'k'+e.key)}
    else if(e.key==='ArrowUp'){e.preventDefault();holdOct('up','kU',true)}
    else if(e.key==='ArrowDown'){e.preventDefault();holdOct('dn','kD',true)}
  });
  document.addEventListener('keyup',function(e){
    if(e.key==='ArrowUp'){holdOct('up','kU',false);return}
    if(e.key==='ArrowDown'){holdOct('dn','kD',false);return}
    if(e.key==='Shift'){releaseId('k*');releaseId('k#')}
    else if(e.key==='8')releaseId('k*');
    else if(e.key==='3')releaseId('k#');
    else if(KEYS.indexOf(e.key)>=0)releaseId('k'+e.key);
  });
  window.addEventListener('blur',releaseAll);
  document.addEventListener('visibilitychange',function(){if(document.hidden)releaseAll()});

  /* ---------- octave controls ---------- */
  // momentary: the shift applies only while the button is held, then falls back to the base octave
  function holdOct(dir,id,on){
    var s=octHold[dir];
    if(on){if(s.has(id))return;s.add(id)}else{if(!s.delete(id))return}
    refreshOct();
  }
  [['up','#octUp'],['dn','#octDn']].forEach(function(p){
    var b=$(p[1]),dir=p[0];
    b.addEventListener('pointerdown',function(e){
      if(e.button>0)return;
      e.preventDefault(); ensureAudio();
      holdOct(dir,'p'+e.pointerId,true);
      try{b.setPointerCapture(e.pointerId)}catch(err){}
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
      b.addEventListener(ev,function(e){holdOct(dir,'p'+e.pointerId,false)});
    });
    b.addEventListener('contextmenu',function(e){e.preventDefault()});
    b.addEventListener('keydown',function(e){
      if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();e.stopPropagation();holdOct(dir,'b',true)}
    });
    b.addEventListener('keyup',function(e){
      if(e.key===' '||e.key==='Enter'){e.preventDefault();holdOct(dir,'b',false)}
    });
    b.addEventListener('blur',function(){holdOct(dir,'b',false)});
  });

  // base-octave selector between the hold buttons: tap or slide across C2…C6
  var selId=null;
  function pickAt(x){
    var r=elOct.getBoundingClientRect();
    var i=Math.floor((x-r.left)/(r.width/5));
    setOct(2+Math.max(0,Math.min(4,i)));
  }
  elSel.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    e.preventDefault(); selId=e.pointerId; pickAt(e.clientX);
    try{elSel.setPointerCapture(e.pointerId)}catch(err){}
  });
  elSel.addEventListener('pointermove',function(e){if(e.pointerId===selId)pickAt(e.clientX)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
    elSel.addEventListener(ev,function(e){if(e.pointerId===selId)selId=null});
  });
  elSel.addEventListener('keydown',function(e){
    var d={ArrowLeft:-1,ArrowRight:1,Home:-9,End:9}[e.key];
    if(d){e.preventDefault();e.stopPropagation();setOct(state.oct+d)}
  });

  /* ---------- shake (device motion) ---------- */
  var shake={on:false,got:false,init:false,g:[0,0,0],last:0,warm:0,thr:14};
  var chk=$('#shakeOn'),sens=$('#sens'),sensRow=$('#sensRow');
  var IDLE='Flick phone ↑ or ↓';
  function onMotion(e){
    var ag=e.accelerationIncludingGravity;
    if(!ag||ag.x==null)return;
    shake.got=true;
    var now=performance.now();
    if(!shake.init){shake.g=[ag.x,ag.y,ag.z];shake.init=true;shake.warm=now+500;elShakeSt.textContent='Ready · '+IDLE;return}
    var g=shake.g;
    g[0]=g[0]*0.96+ag.x*0.04; g[1]=g[1]*0.96+ag.y*0.04; g[2]=g[2]*0.96+ag.z*0.04;
    if(now<shake.warm||now-shake.last<700)return;
    var gm=Math.sqrt(g[0]*g[0]+g[1]*g[1]+g[2]*g[2])||1;
    // linear acceleration projected on the gravity axis; sign-convention independent
    var up=((ag.x-g[0])*g[0]+(ag.y-g[1])*g[1]+(ag.z-g[2])*g[2])/gm;
    if(up>shake.thr){shake.last=now;setOct(state.oct+1)}
    else if(up<-shake.thr){shake.last=now;setOct(state.oct-1)}
  }
  function setThr(){shake.thr=36-(+sens.value)}
  sens.addEventListener('input',function(){setThr();save('sens',sens.value)});
  var savedSens=load('sens','22'); if(+savedSens>=10&&+savedSens<=30)sens.value=savedSens;
  setThr();
  chk.addEventListener('change',function(){
    if(!chk.checked){
      window.removeEventListener('devicemotion',onMotion);
      shake.on=false;shake.init=false;sensRow.hidden=true;elShakeSt.textContent=IDLE;return;
    }
    var p=Promise.resolve('granted');
    try{
      if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
        p=DeviceMotionEvent.requestPermission();
      }
    }catch(err){p=Promise.reject(err)}
    p.then(function(r){
      if(r!=='granted'){chk.checked=false;elShakeSt.textContent='Motion permission denied';return}
      window.addEventListener('devicemotion',onMotion);
      shake.on=true;shake.got=false;shake.init=false;sensRow.hidden=false;
      elShakeSt.textContent='Waiting for sensor…';
      setTimeout(function(){
        if(shake.on&&!shake.got)elShakeSt.textContent='No motion sensor here. Use the octave selector instead.';
      },2500);
    }).catch(function(){
      chk.checked=false;elShakeSt.textContent='No motion sensor here. Use the octave selector instead.';
    });
  });

  /* ---------- chips & select ---------- */
  function syncChips(){
    document.querySelectorAll('.chip[data-voice]').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.voice===state.voice))});
    document.querySelectorAll('.chip[data-mode]').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.mode===state.mode))});
    app.dataset.voice=state.voice;
  }
  document.querySelectorAll('.chip[data-voice]').forEach(function(c){
    c.addEventListener('click',function(){state.voice=c.dataset.voice;save('voice',state.voice);syncChips();refreshLabels();refreshOct()});
  });
  document.querySelectorAll('.chip[data-mode]').forEach(function(c){
    c.addEventListener('click',function(){state.mode=c.dataset.mode;save('mode',state.mode);syncChips();refreshLabels()});
  });
  $('#song').addEventListener('change',function(e){state.song=e.target.value;state.idx=0;refreshFollow()});

  /* ---------- settings sheet ---------- */
  var dlg=$('#settings');
  $('#setBtn').addEventListener('click',function(){releaseAll();if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','')});
  $('#setClose').addEventListener('click',function(){dlg.close?dlg.close():dlg.removeAttribute('open')});
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});

  /* ---------- live waveform on the screen ---------- */
  var cv=$('#viz'),c2=cv.getContext&&cv.getContext('2d'),raf=0;
  function draw(t){
    raf=requestAnimationFrame(draw);
    var dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
    if(!w||!h)return;
    if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
    c2.setTransform(dpr,0,0,dpr,0,0); c2.clearRect(0,0,w,h);
    var hue=+getComputedStyle(lcd).getPropertyValue('--lh')||260;
    if(analyser)analyser.getByteTimeDomainData(wave);
    var N=160,mid=h*0.6,amp=h*0.42,idle=calm?0:2.5;
    var g=c2.createLinearGradient(0,0,w,0);
    g.addColorStop(0,'hsla('+hue+',100%,65%,0)');g.addColorStop(.2,'hsla('+hue+',100%,68%,.85)');
    g.addColorStop(.8,'hsla('+(hue+60)+',100%,66%,.85)');g.addColorStop(1,'hsla('+(hue+60)+',100%,66%,0)');
    c2.lineWidth=2; c2.strokeStyle=g; c2.shadowColor='hsla('+hue+',100%,60%,.9)'; c2.shadowBlur=14;
    c2.beginPath();
    for(var i=0;i<=N;i++){
      var v=wave?(wave[Math.floor(i/N*(wave.length-1))]-128)/128:0;
      var y=mid+v*amp+Math.sin(i*0.09+t*0.0022)*idle;
      if(i)c2.lineTo(i/N*w,y);else c2.moveTo(0,y);
    }
    c2.stroke();
  }
  function runViz(on){cancelAnimationFrame(raf);raf=0;if(on&&c2)raf=requestAnimationFrame(draw)}
