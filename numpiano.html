<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dial Piano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Sora:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow phone-shaped column. Screen on top (with a live waveform), the keypad is the instrument, the octave bar sits under the thumb.
   Colour logic: every note owns a hue (--h, one step of the colour wheel per semitone); a pressed key lights up in its hue
   and the screen + background aura follow the last note (--lh). Dark keys = sharps / low notes, cyan-tinted = high notes. */
@property --lh{syntax:'<number>';inherits:true;initial-value:260}
:root{
  --f-ui:"Sora","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-lcd:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --bg:#EFECF8; --ink:#17131F; --muted:#6B6782; --line:rgba(40,24,90,.10); --panel:rgba(255,255,255,.55);
  --hl:rgba(255,255,255,.95);
  --nat:rgba(255,255,255,.72); --nat-ink:#17131F;
  --shp:rgba(26,20,44,.88); --shp-ink:#F3F0FF;
  --hi:rgba(214,244,255,.78); --hi-ink:#0C3442;
  --mod:rgba(255,255,255,.32); --mod-ink:#3F3A55;
  --screen:#0E0B18; --screen-ink:#F5F2FF; --screen-dim:#8984A6; --screen-line:rgba(255,255,255,.09);
  --accent:#7B5CFF; --accent-2:#FF3D8B; --accent-ink:#FFFFFF;
  --blob-o:.55; --glow-l:58%;
  --shadow-c:rgba(50,24,120,.22);
  --lh:260;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07060D; --ink:#F1EEFA; --muted:#8D89A6; --line:rgba(255,255,255,.09); --panel:rgba(255,255,255,.05);
    --hl:rgba(255,255,255,.12);
    --nat:rgba(255,255,255,.075); --nat-ink:#F3F0FF;
    --shp:rgba(0,0,0,.5); --shp-ink:#C9C3E3;
    --hi:rgba(45,226,230,.12); --hi-ink:#CFFBFF;
    --mod:rgba(255,255,255,.025); --mod-ink:#ADA8C6;
    --screen:rgba(12,10,22,.78); --screen-line:rgba(255,255,255,.08);
    --accent:#8B70FF; --accent-2:#FF4D95;
    --blob-o:.42; --glow-l:62%;
    --shadow-c:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07060D; --ink:#F1EEFA; --muted:#8D89A6; --line:rgba(255,255,255,.09); --panel:rgba(255,255,255,.05);
  --hl:rgba(255,255,255,.12);
  --nat:rgba(255,255,255,.075); --nat-ink:#F3F0FF;
  --shp:rgba(0,0,0,.5); --shp-ink:#C9C3E3;
  --hi:rgba(45,226,230,.12); --hi-ink:#CFFBFF;
  --mod:rgba(255,255,255,.025); --mod-ink:#ADA8C6;
  --screen:rgba(12,10,22,.78); --screen-line:rgba(255,255,255,.08);
  --accent:#8B70FF; --accent-2:#FF4D95;
  --blob-o:.42; --glow-l:62%;
  --shadow-c:rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--f-ui); -webkit-text-size-adjust:100%;
  padding-block:12px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
.app{position:relative; z-index:1; max-width:440px; margin:0 auto; display:flex; flex-direction:column; gap:14px; min-height:calc(100dvh - 36px); justify-content:center}

/* Background aura: three drifting colour blobs + one that takes the hue of the last note */
.aura{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.aura i,.aura b{position:absolute; border-radius:50%; filter:blur(70px); opacity:var(--blob-o)}
.aura i:nth-child(1){width:60vmax; height:60vmax; left:-20vmax; top:-22vmax; background:#7B5CFF}
.aura i:nth-child(2){width:50vmax; height:50vmax; right:-18vmax; top:20vh; background:#FF3D8B}
.aura i:nth-child(3){width:55vmax; height:55vmax; left:10vw; bottom:-30vmax; background:#16C7D9}
.aura b{width:70vmin; height:70vmin; left:50%; top:62%; margin:-35vmin 0 0 -35vmin; background:hsl(var(--lh) 95% 60%); opacity:0; transition:--lh .35s}
@media (prefers-reduced-motion:no-preference){
  .aura i:nth-child(1){animation:drift1 22s ease-in-out infinite alternate}
  .aura i:nth-child(2){animation:drift2 26s ease-in-out infinite alternate}
  .aura i:nth-child(3){animation:drift3 30s ease-in-out infinite alternate}
  .aura b.pulse{animation:pulse .9s ease-out}
  @keyframes drift1{to{transform:translate(18vw,14vh) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-22vw,-10vh) scale(.85)}}
  @keyframes drift3{to{transform:translate(-12vw,-18vh) scale(1.1)}}
  @keyframes pulse{0%{opacity:calc(var(--blob-o) * 1.1);transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
}

/* Screen */
.lcd{
  position:relative; overflow:hidden; isolation:isolate;
  background:var(--screen); color:var(--screen-ink); border-radius:26px; padding:14px 16px 12px;
  font-family:var(--f-lcd); min-height:clamp(170px,26vh,230px); display:flex; flex-direction:column;
  -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 0 0 1px var(--screen-line), inset 0 1px 0 rgba(255,255,255,.08), 0 24px 50px -24px var(--shadow-c);
  user-select:none; -webkit-user-select:none;
  transition:--lh .35s;
}
.lcd::before{
  content:""; position:absolute; z-index:-1; width:110%; aspect-ratio:1; left:-5%; top:-70%;
  background:radial-gradient(closest-side,hsl(var(--lh) 95% 60% / .38),transparent 72%);
}
.lcd canvas{position:absolute; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none}
.dial{min-height:1.3em; margin:6px 120px 0 92px; font-size:.9rem; letter-spacing:.22em; color:var(--screen-dim); white-space:nowrap; overflow:hidden}
.note{
  margin-top:auto; font-size:3.1rem; line-height:1.12; min-height:1.12em; font-weight:800; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transform-origin:0 60%;
  background:linear-gradient(95deg,hsl(var(--lh) 100% 76%),hsl(calc(var(--lh) + 60) 100% 72%));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.note.dim{background:none; color:var(--screen-dim); font-weight:600}
.note.many{font-size:1.45rem; line-height:1.95}
@media (prefers-reduced-motion:no-preference){
  .note.pop{animation:pop .38s cubic-bezier(.2,.9,.25,1.4)}
  @keyframes pop{from{transform:scale(1.22) translateY(-2px); filter:blur(3px); opacity:.4}}
}
.note{margin-right:120px; margin-bottom:4px}
.gear{
  position:absolute; top:8px; left:8px; width:40px; height:40px; display:grid; place-items:center;
  border:0; border-radius:12px; background:transparent; color:var(--screen-ink); cursor:pointer; padding:0;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; transition:background .2s;
}
.songbtn{left:50px; font-size:1.25rem; font-weight:700}
.songbtn.on{background:linear-gradient(140deg,var(--accent),var(--accent-2))}
.gear:hover{background:rgba(255,255,255,.1)}
.gear:focus-visible{outline:2px solid var(--screen-ink); outline-offset:-2px}
.gear svg{width:22px; height:22px; transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
.gear:hover svg{transform:rotate(90deg)}

/* Settings sheet */
dialog.sheet{
  width:min(440px,calc(100vw - 32px)); max-height:calc(100dvh - 32px); overflow:auto;
  margin:auto; padding:0; border:0; border-radius:26px;
  background:color-mix(in srgb,var(--bg) 82%,transparent); color:var(--ink);
  -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 30px 70px -20px var(--shadow-c), 0 0 0 1px var(--line), inset 0 1px 0 var(--hl);
}
dialog.sheet::backdrop{background:rgba(8,6,18,.4); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px)}
@media (prefers-reduced-motion:no-preference){
  dialog.sheet[open]{animation:sheetIn .32s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes sheetIn{from{opacity:0; transform:translateY(16px) scale(.97)}}
}
.sheet-h{display:flex; align-items:center; justify-content:space-between; padding:14px 12px 4px 20px}
.sheet-h h2{margin:0; font-size:1.05rem; font-weight:700; letter-spacing:.04em}
.sheet-b{display:flex; flex-direction:column; gap:14px; padding:8px 20px 20px}
.xbtn{font:inherit; font-size:1.2rem; line-height:1; width:36px; height:36px; border:0; border-radius:12px; background:transparent; color:var(--muted); cursor:pointer}
.xbtn:hover{background:var(--panel)}

/* Settings */
.ctrl{display:flex; flex-direction:column; gap:10px}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.lbl{font-size:.76rem; color:var(--muted); min-width:2.8em}
.chip{
  font:inherit; font-size:.84rem; font-weight:600; padding:6px 14px; min-height:36px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; touch-action:manipulation;
  transition:transform .15s,background .2s,box-shadow .2s;
}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{
  background:linear-gradient(110deg,var(--accent),var(--accent-2)); color:var(--accent-ink); border-color:transparent;
  box-shadow:0 6px 18px -8px var(--accent-2);
}
.hint{margin:0; font-size:.8rem; color:var(--muted)}
select{font:inherit; font-size:.84rem; padding:6px 12px; min-height:36px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink)}
input[type="range"]{accent-color:var(--accent); flex:1; min-width:0}
input[type="checkbox"]{accent-color:var(--accent); width:18px; height:18px; margin:0}
.sw{display:flex; align-items:center; gap:8px; font-size:.9rem; cursor:pointer}
.status{font-size:.78rem; color:var(--muted); min-width:0; flex:1}
.cgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.cgrid label{display:flex; align-items:center; gap:6px; min-width:0; padding:4px 6px 4px 10px; border-radius:14px; background:var(--panel); box-shadow:inset 0 0 0 1px var(--line)}
.cgrid b{font:700 1rem var(--f-lcd); min-width:.8em}
.cgrid select{flex:1; min-width:0; padding:4px 6px; min-height:32px}
.extras{display:flex; flex-direction:column; gap:12px; padding:12px 14px; background:var(--panel); border-radius:18px; box-shadow:inset 0 0 0 1px var(--line)}

/* Keypad */
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; touch-action:none}
.key{
  --h:260;
  position:relative; overflow:hidden; isolation:isolate;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:clamp(64px,11vh,96px); border:0; border-radius:22px; padding:0;
  background:var(--kb); color:var(--ki); font:inherit;
  -webkit-backdrop-filter:blur(12px) saturate(150%); backdrop-filter:blur(12px) saturate(150%);
  box-shadow:inset 0 0 0 1px var(--line), inset 0 1px 0 var(--hl), 0 12px 24px -16px var(--shadow-c);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; cursor:pointer;
  transition:transform .28s cubic-bezier(.2,.9,.3,1.6), box-shadow .3s, background .3s, color .2s;
}
/* note-colour light strip */
.key::after{
  content:""; position:absolute; left:34%; right:34%; bottom:8px; height:3px; border-radius:3px;
  background:hsl(var(--h) 95% var(--glow-l)); box-shadow:0 0 10px hsl(var(--h) 95% var(--glow-l));
  opacity:.75; transition:opacity .2s, left .25s, right .25s;
}
.key .d,.key .s{position:relative; z-index:1}
.key .d{font-size:1.9rem; font-weight:700; line-height:1}
.key .s{font-family:var(--f-lcd); font-size:.7rem; letter-spacing:.06em; min-height:1.1em; opacity:.75}
.key.nat{--kb:var(--nat); --ki:var(--nat-ink)}
.key.shp,.key.lo{--kb:var(--shp); --ki:var(--shp-ink)}
.key.hi{--kb:var(--hi); --ki:var(--hi-ink)}
.key:hover::after{left:26%; right:26%; opacity:1}
.key.down{
  background:linear-gradient(140deg,hsl(var(--h) 95% 62%),hsl(calc(var(--h) + 45) 95% 56%));
  color:#fff; transform:scale(.93);
  box-shadow:inset 0 0 0 1px hsl(var(--h) 100% 80% / .55), 0 0 26px -2px hsl(var(--h) 95% 60% / .75), 0 0 64px -8px hsl(var(--h) 95% 60% / .55);
  transition-duration:.06s;
}
.key.down::after{opacity:0}
.key.down .s{opacity:1}
.key.target{box-shadow:inset 0 0 0 2px hsl(var(--h) 95% var(--glow-l)), 0 0 22px -4px hsl(var(--h) 95% 60%)}
.key:focus-visible,.chip:focus-visible,.octbtn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .key.target:not(.down){animation:beckon 1.1s ease-in-out infinite}
  @keyframes beckon{50%{transform:scale(1.04)}}
}

/* press effects */
.rip{
  position:absolute; z-index:0; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);
  animation:rip .6s ease-out forwards;
}
@keyframes rip{from{transform:scale(0); opacity:1}to{transform:scale(10); opacity:0}}
.fx{position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden}
.fly{
  position:absolute; font:800 1.05rem var(--f-lcd); white-space:nowrap; transform:translate(-50%,-50%);
  color:hsl(var(--h) 100% var(--glow-l)); text-shadow:0 0 12px hsl(var(--h) 100% 60% / .8);
  animation:fly .9s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes fly{
  0%{opacity:0; transform:translate(-50%,-30%) scale(.6)}
  20%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx,0px)),-260%) scale(1.25)}
}

/* Play-along game: notes slide right→left along a lane on the screen to the target ring */
.lcd .dial,.lcd .note{transition:opacity .25s}
.lcd.game .dial,.lcd.game .note{opacity:0}
.lane{position:absolute; z-index:1; left:10px; right:124px; top:52px; bottom:14px; border-radius:18px; overflow:hidden;
  background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ring{position:absolute; left:9px; top:5px; bottom:5px; width:52px; border-radius:16px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), 0 0 18px -2px hsl(var(--lh) 95% 60% / .8)}
.ring.flash{box-shadow:inset 0 0 0 3px #fff, 0 0 30px 2px hsl(var(--lh) 95% 65%)}
.bub{
  --h:260; position:absolute; left:0; top:27%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:13px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; will-change:transform;
  background:linear-gradient(140deg,hsl(var(--h) 95% 62%),hsl(calc(var(--h) + 45) 95% 54%)); color:#fff;
  box-shadow:0 0 18px -3px hsl(var(--h) 95% 60% / .9), inset 0 1px 0 rgba(255,255,255,.5);
}
.bub.lo2{top:73%}
.bub.long{align-items:flex-start; background:linear-gradient(90deg,hsl(var(--h) 95% 60%) 0 44px,hsl(var(--h) 90% 55% / .55) 60px,hsl(calc(var(--h) + 45) 90% 55% / .35))}
.bub.long::after{content:""; position:absolute; left:44px; right:10px; top:50%; height:4px; margin-top:-2px; border-radius:2px; background:rgba(255,255,255,.55)}
.bub.holding{box-shadow:0 0 26px 2px hsl(var(--h) 95% 62%), inset 0 0 0 2px #fff}
.bub b,.bub small{width:44px; text-align:center}
.bub b{font:800 1.35rem var(--f-ui)}
.bub i{position:absolute; left:28px; font:800 .62rem/1 var(--f-ui); font-style:normal; padding:2px 3px; border-radius:5px; background:rgba(10,8,20,.7); color:#fff}
.bub .m-sh{top:2px}
.bub .m-lo{bottom:2px}
.octbtn.need:not(.held){box-shadow:inset 0 0 0 2px hsl(var(--lh) 95% 70%), 0 0 18px -2px hsl(var(--lh) 95% 60%)}
@media (prefers-reduced-motion:no-preference){.octbtn.need:not(.held){animation:beckon 1.1s ease-in-out infinite}}
.bub small{font:600 .55rem var(--f-lcd); opacity:.85; margin-top:2px}
.bub.hit{animation:bubHit .35s ease-out forwards}
.bub.miss{animation:bubMiss .45s ease-in forwards}
@keyframes bubHit{to{transform:var(--at) scale(1.7); opacity:0}}
@keyframes bubMiss{to{transform:var(--at) translateY(26px) scale(.7); opacity:0; filter:grayscale(1)}}
.hud{position:absolute; z-index:2; top:14px; left:96px; right:124px; display:flex; justify-content:space-between; gap:8px;
  font-size:.72rem; color:var(--screen-dim); white-space:nowrap; overflow:hidden}
.hud b{color:var(--screen-ink)}
.judge{position:absolute; z-index:3; left:40px; top:44px; transform:translateX(-50%); font:800 .95rem var(--f-ui); pointer-events:none; white-space:nowrap}
.judge.go{animation:judge .6s ease-out forwards}
@keyframes judge{0%{opacity:0; transform:translate(-50%,6px) scale(.8)}20%{opacity:1; transform:translate(-50%,0) scale(1.1)}100%{opacity:0; transform:translate(-50%,-14px)}}
.judge.perfect{color:#7CFFCB; text-shadow:0 0 12px #2CF0A0}
.judge.good{color:#8FD3FF; text-shadow:0 0 12px #3FA9FF}
.judge.miss{color:#FF7A9A; text-shadow:0 0 12px #FF3D6B}
.cd{position:absolute; z-index:4; inset:0; display:grid; place-items:center; pointer-events:none;
  font:800 4.2rem var(--f-ui); color:#fff; text-shadow:0 0 28px hsl(var(--lh) 95% 60%)}
.cd.go{animation:cd .7s ease-out forwards}
@keyframes cd{0%{opacity:0; transform:scale(1.8)}25%{opacity:1; transform:scale(1)}100%{opacity:0; transform:scale(.85)}}
/* song list */
.songs{display:flex; flex-direction:column; gap:8px}
.lvl{margin:8px 2px 0; font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.lvl:first-child{margin-top:0}
.songitem{font:inherit; text-align:left; display:flex; align-items:center; gap:12px; padding:12px 14px; border:0; border-radius:16px;
  background:var(--panel); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); cursor:pointer; transition:transform .15s, box-shadow .2s}
.songitem:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.songitem:active{transform:scale(.98)}
.songitem i{font-style:normal; font-size:1.4rem; width:1.4em; text-align:center}
.songitem span{flex:1; min-width:0}
.songitem b{display:block; font-size:.95rem}
.songitem small{color:var(--muted); font-size:.74rem}
.songitem em{font-style:normal; font:700 .8rem var(--f-lcd); color:var(--muted)}
.result{padding:14px 16px; border-radius:18px; color:#fff; background:linear-gradient(130deg,var(--accent),var(--accent-2)); box-shadow:0 10px 30px -12px var(--accent-2)}
.result h3{margin:0 0 4px; font-size:.82rem; font-weight:600; opacity:.9}
.result .big{display:flex; align-items:baseline; gap:10px; font:800 2.2rem var(--f-ui)}
.result .big small{font-size:.9rem; font-weight:600}
.result p{margin:4px 0 0; font:600 .78rem var(--f-lcd); opacity:.95}
@media (prefers-reduced-motion:reduce){.bub.hit,.bub.miss,.judge.go,.cd.go{animation-duration:.01s}}

/* Octave hold buttons: stacked in the screen's top-right corner */
.octv{position:absolute; z-index:1; top:10px; right:10px; bottom:10px; width:104px; display:flex; flex-direction:column; gap:8px}
.octbtn{
  flex:1; min-height:56px; font:700 1.05rem var(--f-lcd); border:0; border-radius:18px; padding:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.08); color:var(--screen-ink); cursor:pointer; touch-action:none;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  transition:transform .28s cubic-bezier(.2,.9,.3,1.6), box-shadow .3s, background .3s;
}
#octUp{font:600 2.4rem/1 var(--f-ui)}
.octbtn:hover{background:rgba(255,255,255,.13)}
.octbtn.held{
  background:linear-gradient(140deg,var(--accent),var(--accent-2)); color:var(--accent-ink); transform:scale(.94);
  box-shadow:0 0 22px -4px color-mix(in srgb,var(--accent-2) 75%,transparent); transition-duration:.06s;
}
/* Base-octave strip: slim, changes only by dragging so a stray tap can't move it */
.octsel{
  display:flex; align-items:center; gap:8px; min-width:0; padding:0 2px;
  font-family:var(--f-lcd); cursor:grab; touch-action:none;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; border-radius:999px;
}
.octsel.drag{cursor:grabbing}
.octsel:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.grip{font-size:.8rem; color:var(--muted); line-height:1}
.octrow{flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:4px}
.octrow span{
  display:grid; place-items:center; height:22px; font-size:.68rem; border-radius:999px;
  color:var(--muted); background:var(--panel); box-shadow:inset 0 0 0 1px var(--line);
  transition:background .25s,color .25s,box-shadow .25s,transform .2s;
}
.octrow span.on{
  background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff;
  box-shadow:0 0 12px -2px color-mix(in srgb,var(--accent-2) 70%,transparent);
}
.octsel.drag .octrow span.on{transform:scale(1.12)}
.octrow span.base:not(.on){box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.app[data-voice="dtmf"] .octsel,.app[data-voice="dtmf"] .octv{opacity:.4}

@media (prefers-reduced-motion:reduce){
  .key,.octbtn,.chip{transition:none}
  .rip,.fly{display:none}
}

  }

  var active=new Map();

  function setDown(k,d){

  /* ---------- play-along game ---------- */
  var TRAVEL=2.2,PERFECT=0.08,WINDOW=0.2,HITX=35;   // seconds on screen, judgement windows (s), ring centre (px)
  var DEG=[0,2,4,5,7,9,11];
  var lane=$('#lane'),ring=$('#ring'),elJudge=$('#judge'),elCd=$('#cd'),hud=$('#hud'),songBtn=$('#songBtn');
  var game=null;
  function parseSong(str){
    var out=[],beat=0;
    str.trim().split(/\s+/).forEach(function(tok){
      var m=/^(r|(#?)([1-7])([',]*))(?::([\d.]+))?$/.exec(tok); if(!m)return;
      var len=m[5]?+m[5]:1;
      if(m[1]!=='r'){
        var p=DEG[+m[3]-1]+(m[2]?1:0);
        m[4].split('').forEach(function(c){p+=c==="'"?12:-12});
        out.push({beat:beat,p:p,len:len});
      }
      beat+=len;
    });

  // how to play a pitch on the current layout: a key, plus holding ♯ and/or ▼ 8vb when needed
  // (fewest modifiers first); if the layout can't reach it at all, the same note an octave away is accepted
  var MODS=[[0,0],[1,0],[0,1],[1,1]];
  function keyForPitch(p){
    var pass,i,j,k,v;
    for(pass=0;pass<2;pass++)for(i=0;i<MODS.length;i++)for(j=0;j<KEYS.length;j++){
      k=KEYS[j]; v=baseSemi(k)+MODS[i][0]-12*MODS[i][1];
      if(pass?((v-p)%12+12)%12===0:v===p)return {k:k,sh:MODS[i][0],lo:MODS[i][1],fold:!!pass};
    }
    return {k:'1',sh:0,lo:0,fold:true};
  }
  function tick(hi){
    if(!ctx||!master)return;
    try{
      var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=hi?1320:880; g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.15);
    }catch(e){}
  }
  function setTarget(k){
    KEYS.forEach(function(x){keyEl[x].classList.toggle('target',x===k)});
  }
  function hudUpdate(){
    if(!game)return;
    var done=game.perfect+game.good+game.miss;
    $('#hudSong').textContent=game.song.icon+' '+done+'/'+game.notes.length;
    $('#hudScore').innerHTML=game.combo>1?'<b>'+game.combo+'</b> combo':'';
  }
  /* backing track: songs with a `backing` chord list (bar chords, :n = beats, default a 4/4 bar, r = rest) get a small
     synthesized orchestra, scheduled on the audio clock so it stays locked to the scrolling notes.
     First half (soft): string section pad, cellos + basses, pizzicato on 2 & 4, clarinet arpeggios.
     Second half (fuller): adds French horns, a flute descant and timpani.
     Final chord: tutti with trumpets, a timpani roll into the last hit and a cymbal crash. */
  var CHORDS={C:[0,4,7],Dm:[2,5,9],Em:[4,7,11],F:[5,9,12],G:[7,11,14],G7:[7,11,14,17],Am:[9,12,16],E:[4,8,11],D7:[2,6,9,12]};
  var INST={
    strings:{w:'sawtooth',det:[-9,0,8],cut:1800,a:0.35,r:0.6,peak:0.02,vib:[5.2,7]},
    violins:{w:'sawtooth',det:[-7,6],cut:3200,a:0.3,r:0.8,peak:0.016,vib:[5.6,9]},
    cello:{w:'sawtooth',det:[-5,5],cut:700,a:0.07,r:0.3,peak:0.06,vib:[5,5]},
    contrabass:{w:'sawtooth',det:[0],cut:380,a:0.08,r:0.3,peak:0.06},
    // plucked bass in a register phone speakers can reproduce; bright attack (filter sweep) marks every beat
    bass:{w:'sawtooth',det:[-6,6],cut:520,fenv:5,a:0.006,pluck:0.42,peak:0.16},
    pizz:{w:'triangle',det:[0],cut:2000,a:0.004,pluck:0.28,peak:0.06},
    clarinet:{w:'square',det:[0],cut:1300,a:0.025,r:0.06,peak:0.02},
    horn:{w:'sawtooth',det:[-4,4],cut:850,a:0.2,r:0.5,peak:0.03,vib:[4.5,4]},
    flute:{w:'sine',det:[0],cut:6000,a:0.09,r:0.25,peak:0.05,vib:[5.5,12]},
    trumpet:{w:'sawtooth',det:[-3,3],cut:2600,a:0.04,r:0.5,peak:0.028,vib:[5.5,6]}
  };
  var crashBuf=null;
  function parseBacking(str){
    var out=[],beat=0;
    str.trim().split(/\s+/).forEach(function(tok){
      var m=/^(\w+)(?::([\d.]+))?$/.exec(tok); if(!m)return;
      var len=m[2]?+m[2]:4;
      if(m[1]==='r'){beat+=len;return}
      if(!CHORDS[m[1]])return;
      out.push({beat:beat,len:len,tones:CHORDS[m[1]]}); beat+=len;
    });

  }
  // one note of an orchestral voice: detuned oscillators → lowpass → envelope, optional vibrato
  function play(bus,name,t,midi,dur,vol){
    var o=INST[name],g=ctx.createGain(),f=ctx.createBiquadFilter(),peak=o.peak*(vol||1);
    f.type='lowpass'; f.frequency.value=o.cut; f.connect(g); g.connect(bus);
    if(o.fenv){f.frequency.setValueAtTime(o.cut*o.fenv,t);f.frequency.exponentialRampToValueAtTime(o.cut,t+0.18)}
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+o.a);
    var stop;
    if(o.pluck){g.gain.exponentialRampToValueAtTime(0.0001,t+o.a+o.pluck);stop=t+o.a+o.pluck+0.05}
    else{var end=t+Math.max(dur,o.a+0.02);g.gain.setTargetAtTime(0.0001,end,o.r/3);stop=end+o.r+0.1}
    var lg=null;
    if(o.vib){var lfo=ctx.createOscillator();lg=ctx.createGain();lfo.frequency.value=o.vib[0];lg.gain.value=o.vib[1];lfo.connect(lg);lfo.start(t);lfo.stop(stop)}
    o.det.forEach(function(d){
      var os=ctx.createOscillator(); os.type=o.w; os.frequency.value=mtof(midi); os.detune.value=d;
      if(lg)lg.connect(os.detune); os.connect(f); os.start(t); os.stop(stop);
    });

  function timpani(bus,t,midi,vol){
    var f0=mtof(midi);
    [[1,1],[1.5,0.35],[2,0.2]].forEach(function(pt){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.setValueAtTime(f0*pt[0]*1.02,t); o.frequency.exponentialRampToValueAtTime(f0*pt[0],t+0.08);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol*pt[1],t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+1.3/pt[0]);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t+1.4);
    });
    if(noiseBuf){
      var n=ctx.createBufferSource(),lp=ctx.createBiquadFilter(),ng=ctx.createGain();
      n.buffer=noiseBuf; lp.type='lowpass'; lp.frequency.value=500;
      ng.gain.setValueAtTime(vol*0.5,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
      n.connect(lp); lp.connect(ng); ng.connect(bus); n.start(t); n.stop(t+0.08);
    }
  }
  function cymbal(bus,t,vol){
    if(!crashBuf){
      crashBuf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*2.5),ctx.sampleRate);
      var d=crashBuf.getChannelData(0); for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    var n=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();
    n.buffer=crashBuf; hp.type='highpass'; hp.frequency.value=4500;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
    n.connect(hp); hp.connect(g); g.connect(bus); n.start(t); n.stop(t+2.5);
  }
  function click(bus,t,hi){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=hi?1760:1320; g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.1,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.1);
  }
  function scheduleBacking(song,spb){
    if(!song.backing||!ctx||!master)return null;
    try{
      var bus=ctx.createGain(); bus.gain.value=1.2; bus.connect(master);
      var t0=ctx.currentTime+TRAVEL,base=(state.oct+1)*12;   // beat 0 = first melody note hits the ring
      for(var c=-4;c<0;c++){var tc=t0+c*spb;if(tc>ctx.currentTime)click(bus,tc,c===-4)}
      var chords=parseBacking(song.backing),last=chords[chords.length-1],half=(last.beat+last.len)/2;
      chords.forEach(function(ch){
        var tn=ch.tones,t=t0+ch.beat*spb,len=ch.len*spb,fin=ch===last,loud=ch.beat>=half;
        var root=((tn[0]%12)+12)%12,bass=base-24+root; if(root>7)bass-=12;
        var v=loud?1.35:1;
        if(fin){
          // tutti on the last chord
          var ring=Math.max(len,spb*3);
          for(var rb=0;rb<12;rb++)timpani(bus,t-2*spb+rb*spb/6,bass,0.05+rb*0.018);
          timpani(bus,t,bass,0.42); cymbal(bus,t,0.12);
          [base+tn[0],base+tn[1],base+tn[2]].forEach(function(m){play(bus,'trumpet',t,m,ring,1.2)});
          [base-12+tn[0],base-12+tn[1],base-12+tn[2],base+tn[0]].forEach(function(m){play(bus,'strings',t,m,ring,1.5)});
          play(bus,'violins',t,base+12+tn[0],ring,1.4); play(bus,'violins',t,base+12+tn[2],ring,1.2);
          play(bus,'horn',t,base-12+tn[2],ring,1.4); play(bus,'flute',t,base+12+tn[2],ring,1);
          play(bus,'cello',t,bass,ring,1.4); play(bus,'contrabass',t,bass-12,ring,1.4);
          play(bus,'bass',t,bass+12,0,1.4);
          return;
        }
        // strings pad + low strings on the bass line (root, then fifth halfway through the bar)
        [base-12+tn[0],base-12+tn[1],base-12+tn[2],base+tn[0]].forEach(function(m){play(bus,'strings',t,m,len,v)});
        if(loud)play(bus,'violins',t,base+12+tn[0],len,1);
        var h=len/2;
        play(bus,'cello',t,bass,h,v*0.6); play(bus,'cello',t+h,bass+7,h,v*0.6);
        // bass line on every beat: root, fifth, octave, fifth — accented on 1, a little on 3
        var bl=bass+12,walk=[0,7,12,7];
        for(var bb=0;bb<ch.len;bb++)play(bus,'bass',t+bb*spb,bl+walk[bb%4],0,bb===0?1.25:(bb===2?1.05:0.85));
        play(bus,'contrabass',t,bass-12,h,v); play(bus,'contrabass',t+h,bass-5,h,v);
        // pizzicato on beats 2 & 4, clarinet arpeggio in eighths
        var arp=[tn[0],tn[1],tn[2],tn[0]+12,tn[2],tn[1],tn[2],tn[1]];
        for(var b=0;b<ch.len;b++){
          var tb=t+b*spb;
          if(b%2===1)tn.forEach(function(x){play(bus,'pizz',tb,base-12+x,0,loud?0.7:1)});
          for(var e=0;e<2;e++)play(bus,'clarinet',tb+e*spb/2,base-12+arp[(b*2+e)%8],spb/2*0.9,loud?0.8:1);
        }
        if(loud){
          // horns hold the chord, flute sings a descant (third, then fifth), timpani on 1 & 3
          play(bus,'horn',t,base-12+tn[2],len,1); play(bus,'horn',t,base+tn[1],len,1);
          play(bus,'flute',t,base+12+tn[1],h,1); play(bus,'flute',t+h,base+12+tn[2],h,1);
          timpani(bus,t,bass,0.26); timpani(bus,t+h,bass+7,0.16);
        }else{
          timpani(bus,t,bass,0.14);
        }
      });
      return bus;
    }catch(e){if(window.console)console.warn('numpiano: backing failed',e);return null}
  }
  // pick the minor key signature that lets the song be played with the fewest ♯ / ▼ 8vb holds
  // (only the natural-note layouts use a signature; ties keep the current choice, then the plainest)
  function autoKey(song){
    if(state.mode!=='diatonic'&&state.mode!=='numpad')return;
    var ps=parseSong(song.notes).map(function(n){return n.p}),keep=state.keysig,best=null;
    for(var i=0;i<ksel.options.length;i++){
      state.keysig=+ksel.options[i].value;
      var c=0;
      ps.forEach(function(p){var m=keyForPitch(p);c+=m.sh+m.lo+(m.fold?5:0)});
      if(!best||c<best.c||(c===best.c&&i===ksel.selectedIndex))best={c:c,i:i};
    }
    state.keysig=keep;
    if(best&&best.i!==ksel.selectedIndex){ksel.selectedIndex=best.i;setKey()}
  }
  function startSong(song){
    stopGame(); releaseAll(); ensureAudio(); autoKey(song);
    var spb=60/song.bpm;
    game={song:song,start:0,raf:0,timers:[],perfect:0,good:0,miss:0,combo:0,maxCombo:0,endAt:0,target:null,
      notes:parseSong(song.notes).map(function(n){
        var m=keyForPitch(n.p);
        // notes of 1.5+ beats (and long enough in time) become hold bars
        var dur=n.len*spb,long=n.len>=1.5&&dur>=0.6;
        return {T:TRAVEL+n.beat*spb,dur:long?dur*0.85:0,k:m.k,sh:m.sh,lo:m.lo,fold:m.fold,p:n.p,el:null,res:null};
      })};
    // notes alternate between a top and a bottom row, so only every second note can collide
    game.minGap=9;
    for(var gi=2;gi<game.notes.length;gi++)game.minGap=Math.min(game.minGap,Math.max(0.05,game.notes[gi].T-game.notes[gi-2].T));
    lcd.classList.add('game'); lane.hidden=false; hud.hidden=false; songBtn.textContent='■'; songBtn.classList.add('on');
    songBtn.setAttribute('aria-label','Stop song');
    hudUpdate();
    ['3','2','1','Play!'].forEach(function(txt,i){
      game.timers.push(setTimeout(function(){
        elCd.hidden=false; elCd.textContent=txt; restart(elCd,'go'); tick(i===3);
        if(i===3){
          game.start=performance.now()/1000; game.raf=requestAnimationFrame(loop);
          game.bus=scheduleBacking(song,spb);
        }
      },i*700));
    });
  }
  function loop(){
    if(!game)return;
    game.raf=requestAnimationFrame(loop);
    // scroll at least fast enough that back-to-back notes sit a bubble-width apart
    var now=performance.now()/1000-game.start,dist=lane.clientWidth-HITX+30,next=null,pending=0;
    var speed=Math.max(dist/TRAVEL,52/game.minGap),travel=dist/speed;
    for(var i=0;i<game.notes.length;i++){
      var n=game.notes[i];
      if(n.holding){
        pending++;
        if(now>=n.T+n.dur){endHold(n,true);continue}
        n.el.style.transform='translate3d('+HITX+'px,0,0)';
        n.el.style.width=Math.max(44,(n.T+n.dur-now)*speed+44)+'px';
        continue;
      }
      if(n.res)continue;
      pending++;
      var dt=n.T-now;
      if(dt>travel+0.15)break;
      if(dt<-WINDOW){judgeNote(n,'miss');continue}
      if(!n.el){
        n.el=document.createElement('div'); n.el.className='bub'+(i%2?' lo2':''); n.el.style.setProperty('--h',(260+((n.p%12)+12)%12*30)%360);
        n.el.innerHTML='<b></b><small></small>'+(n.sh?'<i class="m-sh">♯</i>':'')+(n.lo?'<i class="m-lo">▼</i>':'');
        n.el.firstChild.textContent=n.k; n.el.children[1].textContent=nameSemi(n.p);
        if(n.dur){n.el.classList.add('long');n.el.dataset.dur=n.dur.toFixed(2)}
        lane.appendChild(n.el);
      }
      if(n.dur)n.el.style.width=Math.max(44,n.dur*speed+44)+'px';
      n.at='translate3d('+(HITX+dt*speed).toFixed(1)+'px,0,0)'; n.el.style.transform=n.at;
      if(!next)next=n;
    }
    var tk=next?next.k+next.sh+next.lo:null;
    if(tk!==game.target){
      game.target=tk; setTarget(next&&next.k);
      $('#octUp').classList.toggle('need',!!(next&&next.sh)); $('#octDn').classList.toggle('need',!!(next&&next.lo));
    }
    if(!pending){
      if(!game.endAt)game.endAt=now+0.9;
      else if(now>game.endAt)finishSong();
    }
  }
  function judgeNote(n,res,id){
    n.res=res; game[res]++;
    if(res==='miss'){game.combo=0}else{game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo)}
    if(n.dur&&res!=='miss'&&n.el){n.holding=true;n.holdId=id;n.el.classList.add('holding')}
    else if(n.el){
      var el=n.el; el.style.setProperty('--at',n.at||'none'); el.classList.add(res==='miss'?'miss':'hit');
      setTimeout(function(){el.remove()},500);
    }
    showJudge(res,res==='perfect'?'Perfect!':(res==='good'?'Good':'Miss'));
    if(res!=='miss')restart(ring,'flash');
    hudUpdate();
  }
  function showJudge(cls,txt){elJudge.className='judge '+cls; elJudge.textContent=txt; restart(elJudge,'go')}
  // a hold ends when the bar runs out (full) or when the key is let go too early
  function endHold(n,full){
    n.holding=false;
    var el=n.el; el.classList.remove('holding');
    el.style.setProperty('--at','translate3d('+HITX+'px,0,0)'); el.classList.add(full?'hit':'miss');
    setTimeout(function(){el.remove()},500);
    if(full){showJudge('perfect','Hold ✓');restart(ring,'flash')}
    else{
      if(n.res==='perfect'){game.perfect--;game.good++;n.res='good'}
      game.combo=0; showJudge('miss','Early!');
    }
    hudUpdate();
  }
  function gameRelease(id){
    if(!game)return;
    var now=performance.now()/1000-game.start;
    game.notes.forEach(function(n){
      if(n.holding&&n.holdId===id)endHold(n,now>=n.T+n.dur-0.25);
    });
  }
  // called on every key press while a song runs: the closest matching note inside the window is hit,
  // a wrong key while a note is due counts as a miss for that note
  function gamePress(k,id){
    if(!game||!game.start)return null;
    var now=performance.now()/1000-game.start,best=null,bd=9,near=null,nd=9;
    var played=semi(k)-(octHold.dn.size?12:0);
    for(var i=0;i<game.notes.length;i++){
      var n=game.notes[i]; if(n.res)continue;
      if(n.T-now>WINDOW)break;
      var d=Math.abs(n.T-now); if(d>WINDOW)continue;
      var ok=played===n.p||(n.fold&&((played-n.p)%12+12)%12===0);
      if(ok&&d<bd){best=n;bd=d}
      if(d<nd){near=n;nd=d}
    }
    if(best){judgeNote(best,bd<=PERFECT?'perfect':'good',id);return best}
    if(near)judgeNote(near,'miss');
    return null;
  }
  function stopGame(){
    if(!game)return;
    game.timers.forEach(clearTimeout); cancelAnimationFrame(game.raf);
    if(game.bus){
      // fade out and drop whatever backing is still scheduled
      var bus=game.bus; try{bus.gain.setTargetAtTime(0,ctx.currentTime,0.05)}catch(e){}
      setTimeout(function(){try{bus.disconnect()}catch(e){}},400);
    }
    game.notes.forEach(function(n){if(n.el)n.el.remove()});
    game=null; setTarget(null);
    $('#octUp').classList.remove('need'); $('#octDn').classList.remove('need');
    lcd.classList.remove('game'); lane.hidden=true; hud.hidden=true; elCd.hidden=true;
    songBtn.textContent='♫'; songBtn.classList.remove('on'); songBtn.setAttribute('aria-label','Play along');
  }
  function finishSong(){
    var g=game,total=g.notes.length,acc=Math.round((g.perfect+g.good*0.6)/total*100);
    var grade=acc>=95?'S':acc>=85?'A':acc>=70?'B':acc>=50?'C':'D';
    var best=+load('best.'+g.song.id,'0')||0;
    if(acc>best)save('best.'+g.song.id,acc);
    stopGame();
    var el=$('#result');
    el.innerHTML='<h3></h3><div class="big">'+grade+' <small>'+acc+'%'+(acc>best&&best?' · new best!':'')+'</small></div>'+
      '<p>Perfect '+g.perfect+' · Good '+g.good+' · Miss '+g.miss+' · Max combo '+g.maxCombo+'</p>';
    el.firstChild.textContent=g.song.icon+' '+g.song.name;
    el.hidden=false;
    openSongs(true);
  }
  function openSongs(keepResult){
    if(!keepResult)$('#result').hidden=true;
    var list=$('#songList'); list.innerHTML='';
    LEVELS.forEach(function(lv){
      var h=document.createElement('h3'); h.className='lvl'; h.textContent=lv[2]+' '+lv[1]; list.appendChild(h);
      SONGS.filter(function(x){return x.lvl===lv[0]}).forEach(addSong);
    });
    function addSong(song){
      var b=document.createElement('button'); b.type='button'; b.className='songitem';
      var best=+load('best.'+song.id,'0')||0,count=parseSong(song.notes).length;
      b.innerHTML='<i></i><span><b></b><small></small></span><em></em>';
      b.querySelector('i').textContent=song.icon; b.querySelector('b').textContent=song.name;
      b.querySelector('small').textContent=song.by+' · '+count+' notes'+(song.backing?' · 🎶 backing track':'');
      b.querySelector('em').textContent=best?best+'%':'';
      b.addEventListener('click',function(){songsDlg.close();startSong(song)});
      list.appendChild(b);
    }
    if(songsDlg.showModal)songsDlg.showModal();else songsDlg.setAttribute('open','');
  }

  /* ---------- press / release ---------- */
  function press(k,id,pt){
    if(active.has(id))return;
    ensureAudio();
    var dtmf=state.voice==='dtmf';
    setDown(k,1);
    state.dial+=k;
    var entry={k:k};
    gamePress(k,id);
    if(ctx&&master){
      if(dtmf){entry.voice=startVoice('dtmf',DTMF[k]);entry.nm=DTMF[k][0]+'+'+DTMF[k][1]}
      else{
        var midi=(curOct()+1)*12+semi(k);
        entry.voice=startVoice(state.voice,midi);
        entry.nm=nameMidi(midi);
      }
    }else{entry.nm=k}
    state.last=entry.nm;
    active.set(id,entry);
    if(navigator.vibrate){try{navigator.vibrate(6)}catch(e){}}
    render();
    if(!calm)restart(elNote,'pop');
    sparkle(keyEl[k],hueOf(k),entry.nm,pt);
  }
  function releaseId(id){
    var en=active.get(id); if(!en)return;
    active.delete(id);
    setDown(en.k,-1);
    if(en.voice)stopVoice(en.voice);
    gameRelease(id);
    render();
  }
  function releaseAll(){
    Array.from(active.keys()).forEach(releaseId);
    octHold.up.clear(); octHold.dn.clear(); refreshOct(); refreshLabels();
  }

  pad.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    var el=e.target.closest('.key'); if(!el)return;
    e.preventDefault();
    press(el.dataset.k,'p'+e.pointerId,{x:e.clientX,y:e.clientY});
    try{el.setPointerCapture(e.pointerId)}catch(err){}
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
    pad.addEventListener(ev,function(e){releaseId('p'+e.pointerId)});
  });
  pad.addEventListener('contextmenu',function(e){e.preventDefault()});

  document.addEventListener('keydown',function(e){
    if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
    if(document.querySelector('dialog[open]'))return;
    var t=e.target; if(t&&/^(SELECT|INPUT|TEXTAREA)$/.test(t.tagName))return;
    if(KEYS.indexOf(e.key)>=0){e.preventDefault();press(e.key,'k'+e.key)}
    else if(e.key==='ArrowUp'){e.preventDefault();holdOct('up','kU',true)}
    else if(e.key==='ArrowDown'){e.preventDefault();holdOct('dn','kD',true)}
  });
  document.addEventListener('keyup',function(e){
    if(e.key==='ArrowUp'){holdOct('up','kU',false);return}
    if(e.key==='ArrowDown'){holdOct('dn','kD',false);return}
    // * and # are Shift+8 / Shift+3, so releasing 8, 3 or Shift also ends a held * / #
    if(e.key==='Shift'){releaseId('k*');releaseId('k#');return}
    if(KEYS.indexOf(e.key)>=0)releaseId('k'+e.key);
    if(e.key==='8')releaseId('k*');
    if(e.key==='3')releaseId('k#');
  });
  window.addEventListener('blur',releaseAll);
  document.addEventListener('visibilitychange',function(){if(document.hidden)releaseAll()});

  /* ---------- octave controls ---------- */
  // momentary: ▼ 8vb drops an octave and ♯ raises a semitone only while held ('up' set = ♯)
  function holdOct(dir,id,on){
    var s=octHold[dir];
    if(on){if(s.has(id))return;s.add(id)}else{if(!s.delete(id))return}
    refreshOct();
    if(dir==='up')refreshLabels();
  }
  [['up','#octUp'],['dn','#octDn']].forEach(function(p){
    var b=$(p[1]),dir=p[0];
    b.addEventListener('pointerdown',function(e){
      if(e.button>0)return;
      e.preventDefault(); ensureAudio();
      holdOct(dir,'p'+e.pointerId,true);
      try{b.setPointerCapture(e.pointerId)}catch(err){}
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
      b.addEventListener(ev,function(e){holdOct(dir,'p'+e.pointerId,false)});
    });
    b.addEventListener('contextmenu',function(e){e.preventDefault()});
    b.addEventListener('keydown',function(e){
      if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();e.stopPropagation();holdOct(dir,'b',true)}
    });
    b.addEventListener('keyup',function(e){
      if(e.key===' '||e.key==='Enter'){e.preventDefault();holdOct(dir,'b',false)}
    });
    b.addEventListener('blur',function(){holdOct(dir,'b',false)});
  });

  // base-octave strip: drag only. A tap does nothing; once the finger has moved 10px,
  // every strip-segment of travel shifts the base octave by one
  var drag=null;
  elSel.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    e.preventDefault(); drag={id:e.pointerId,x:e.clientX,oct:state.oct,on:false};
    try{elSel.setPointerCapture(e.pointerId)}catch(err){}
  });
  elSel.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var dx=e.clientX-drag.x;
    if(!drag.on){if(Math.abs(dx)<10)return;drag.on=true;elSel.classList.add('drag')}
    setOct(drag.oct+Math.round(dx/(elOct.getBoundingClientRect().width/5)));
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
    elSel.addEventListener(ev,function(e){if(drag&&e.pointerId===drag.id){drag=null;elSel.classList.remove('drag')}});
  });
  elSel.addEventListener('keydown',function(e){
    var d={ArrowLeft:-1,ArrowRight:1,Home:-9,End:9}[e.key];
    if(d){e.preventDefault();e.stopPropagation();setOct(state.oct+d)}
  });

  /* ---------- shake (device motion) ---------- */
  var shake={on:false,got:false,init:false,g:[0,0,0],last:0,warm:0,thr:14};
  var chk=$('#shakeOn'),sens=$('#sens'),sensRow=$('#sensRow');
  var IDLE='Flick phone ↑ or ↓';
  function onMotion(e){
    var ag=e.accelerationIncludingGravity;
    if(!ag||ag.x==null)return;
    shake.got=true;
    var now=performance.now();
    if(!shake.init){shake.g=[ag.x,ag.y,ag.z];shake.init=true;shake.warm=now+500;elShakeSt.textContent='Ready · '+IDLE;return}
    var g=shake.g;
    g[0]=g[0]*0.96+ag.x*0.04; g[1]=g[1]*0.96+ag.y*0.04; g[2]=g[2]*0.96+ag.z*0.04;
    if(now<shake.warm||now-shake.last<700)return;
    var gm=Math.sqrt(g[0]*g[0]+g[1]*g[1]+g[2]*g[2])||1;
    // linear acceleration projected on the gravity axis; sign-convention independent
    var up=((ag.x-g[0])*g[0]+(ag.y-g[1])*g[1]+(ag.z-g[2])*g[2])/gm;
    if(up>shake.thr){shake.last=now;setOct(state.oct+1)}
    else if(up<-shake.thr){shake.last=now;setOct(state.oct-1)}
  }
  function setThr(){shake.thr=36-(+sens.value)}
  sens.addEventListener('input',function(){setThr();save('sens',sens.value)});
  var savedSens=load('sens','22'); if(+savedSens>=10&&+savedSens<=30)sens.value=savedSens;
  setThr();
  chk.addEventListener('change',function(){
    if(!chk.checked){
      window.removeEventListener('devicemotion',onMotion);
      shake.on=false;shake.init=false;sensRow.hidden=true;elShakeSt.textContent=IDLE;return;
    }
    var p=Promise.resolve('granted');
    try{
      if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
        p=DeviceMotionEvent.requestPermission();
      }
    }catch(err){p=Promise.reject(err)}
    p.then(function(r){
      if(r!=='granted'){chk.checked=false;elShakeSt.textContent='Motion permission denied';return}
      window.addEventListener('devicemotion',onMotion);
      shake.on=true;shake.got=false;shake.init=false;sensRow.hidden=false;
      elShakeSt.textContent='Waiting for sensor…';
      setTimeout(function(){
        if(shake.on&&!shake.got)elShakeSt.textContent='No motion sensor here. Use the octave selector instead.';
      },2500);
    }).catch(function(){
      chk.checked=false;elShakeSt.textContent='No motion sensor here. Use the octave selector instead.';
    });
  });

  /* ---------- chips & select ---------- */
  function syncChips(){
    document.querySelectorAll('.chip[data-voice]').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.voice===state.voice))});
    document.querySelectorAll('.chip[data-mode]').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.mode===state.mode))});
    app.dataset.voice=state.voice;
  }
  document.querySelectorAll('.chip[data-voice]').forEach(function(c){
    c.addEventListener('click',function(){state.voice=c.dataset.voice;save('voice',state.voice);syncChips();refreshLabels();refreshOct()});
  });
  document.querySelectorAll('.chip[data-mode]').forEach(function(c){
    c.addEventListener('click',function(){state.mode=c.dataset.mode;save('mode',state.mode);syncChips();refreshLabels()});
  });
  var ksel=$('#keysig');
  function setKey(){
    state.keysig=+ksel.value; state.keyIdx=ksel.selectedIndex; save('keyIdx',state.keyIdx); refreshLabels();
  }
  if(state.keyIdx>0&&state.keyIdx<ksel.options.length)ksel.selectedIndex=state.keyIdx;
  ksel.addEventListener('change',setKey); setKey();

  /* ---------- settings sheet ---------- */
  var dlg=$('#settings');
  $('#setBtn').addEventListener('click',function(){stopGame();releaseAll();if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','')});
  $('#setClose').addEventListener('click',function(){dlg.close?dlg.close():dlg.removeAttribute('open')});
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
  var songsDlg=$('#songsDlg');
  songBtn.addEventListener('click',function(){if(game)stopGame();else{releaseAll();openSongs(false)}});
  $('#songsClose').addEventListener('click',function(){songsDlg.close?songsDlg.close():songsDlg.removeAttribute('open')});
  songsDlg.addEventListener('click',function(e){if(e.target===songsDlg)songsDlg.close()});
  document.addEventListener('visibilitychange',function(){if(document.hidden)stopGame()});

  /* ---------- live waveform on the screen ---------- */
  var cv=$('#viz'),c2=cv.getContext&&cv.getContext('2d'),raf=0;
  function draw(t){
    raf=requestAnimationFrame(draw);
    var dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
    if(!w||!h)return;
    if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
    c2.setTransform(dpr,0,0,dpr,0,0); c2.clearRect(0,0,w,h);
    var hue=+getComputedStyle(lcd).getPropertyValue('--lh')||260;
    if(analyser)analyser.getByteTimeDomainData(wave);
    var N=160,mid=h*0.6,amp=h*0.42,idle=calm?0:2.5;
    var g=c2.createLinearGradient(0,0,w,0);
    g.addColorStop(0,'hsla('+hue+',100%,65%,0)');g.addColorStop(.2,'hsla('+hue+',100%,68%,.85)');
    g.addColorStop(.8,'hsla('+(hue+60)+',100%,66%,.85)');g.addColorStop(1,'hsla('+(hue+60)+',100%,66%,0)');
    c2.lineWidth=2; c2.strokeStyle=g; c2.shadowColor='hsla('+hue+',100%,60%,.9)'; c2.shadowBlur=14;
    c2.beginPath();
    for(var i=0;i<=N;i++){
      var v=wave?(wave[Math.floor(i/N*(wave.length-1))]-128)/128:0;
      var y=mid+v*amp+Math.sin(i*0.09+t*0.0022)*idle;
      if(i)c2.lineTo(i/N*w,y);else c2.moveTo(0,y);
    }
    c2.stroke();
  }
  function runViz(on){cancelAnimationFrame(raf);raf=0;if(on&&c2)raf=requestAnimationFrame(draw)}
  document.addEventListener('visibilitychange',function(){runViz(!document.hidden)});
  runViz(true);

  syncChips(); syncCustom(); refreshLabels(); refreshOct();
})();
</script>

</body></html>
