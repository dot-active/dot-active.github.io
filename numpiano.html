<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>拨号琴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@500;600&display=swap">
<style>
/* Layout: one narrow phone-shaped column. LCD on top, the keypad is the instrument, the octave bar sits under the thumb.
   Colour logic: light keys = natural notes, dark keys = sharps (like a piano), blue-tinted keys = high notes, grey keys = held modifiers. */
:root{
  --f-ui:"Instrument Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-lcd:"DM Mono","SF Mono",ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --bg:#DCE1E6; --panel:#EAEEF2; --ink:#18212C; --muted:#566474; --line:#BAC3CC;
  --nat:#FAFBFC; --nat-ink:#18212C; --nat-edge:#A9B3BE;
  --shp:#2B333D; --shp-ink:#EDF1F5; --shp-edge:#12171D;
  --hi:#DFE8FB; --hi-ink:#16244A; --hi-edge:#9DB0DE;
  --mod:#CDD5DD; --mod-ink:#18212C; --mod-edge:#98A4B1;
  --accent:#2457E6; --accent-ink:#FFFFFF; --accent-edge:#173B9C;
  --lcd:#C4D2C1; --lcd-ink:#17261C; --lcd-dim:#62796A;
  --shadow-c:rgba(10,18,28,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1216; --panel:#171D23; --ink:#E6EBF0; --muted:#8F9CAA; --line:#2A333C;
    --nat:#38414B; --nat-ink:#F2F5F8; --nat-edge:#1B2127;
    --shp:#0A0D10; --shp-ink:#C5CED8; --shp-edge:#000000;
    --hi:#2B3A5E; --hi-ink:#DCE6FF; --hi-edge:#141C30;
    --mod:#242C35; --mod-ink:#D3DBE3; --mod-edge:#10151A;
    --accent:#6F95FF; --accent-ink:#0A1226; --accent-edge:#3A58B3;
    --lcd:#18271E; --lcd-ink:#B6EEC3; --lcd-dim:#547A60;
    --shadow-c:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1216; --panel:#171D23; --ink:#E6EBF0; --muted:#8F9CAA; --line:#2A333C;
  --nat:#38414B; --nat-ink:#F2F5F8; --nat-edge:#1B2127;
  --shp:#0A0D10; --shp-ink:#C5CED8; --shp-edge:#000000;
  --hi:#2B3A5E; --hi-ink:#DCE6FF; --hi-edge:#141C30;
  --mod:#242C35; --mod-ink:#D3DBE3; --mod-edge:#10151A;
  --accent:#6F95FF; --accent-ink:#0A1226; --accent-edge:#3A58B3;
  --lcd:#18271E; --lcd-ink:#B6EEC3; --lcd-dim:#547A60;
  --shadow-c:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--f-ui); -webkit-text-size-adjust:100%;
  padding-block:12px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:440px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
header{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
h1{margin:0; font-size:1.05rem; font-weight:600; letter-spacing:.06em}
header span{color:var(--muted); font-size:.8rem}

/* LCD */
.lcd{
  background:var(--lcd); color:var(--lcd-ink); border-radius:8px; padding:10px 12px 8px;
  font-family:var(--f-lcd);
  box-shadow:inset 0 2px 5px var(--shadow-c), 0 0 0 1px var(--line);
  touch-action:none; user-select:none; -webkit-user-select:none; cursor:ns-resize;
}
.dial{min-height:1.3em; font-size:.95rem; letter-spacing:.14em; color:var(--lcd-dim); white-space:nowrap; overflow:hidden}
.note{font-size:2.3rem; line-height:1.15; min-height:1.15em; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.note.dim{color:var(--lcd-dim)}
.note.many{font-size:1.35rem; line-height:1.9}
.octrow{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:6px}
.octrow span{text-align:center; font-size:.72rem; padding:2px 0; border-radius:3px; color:var(--lcd-dim); box-shadow:inset 0 0 0 1px var(--lcd-dim)}
.octrow span.on{background:var(--lcd-ink); color:var(--lcd); box-shadow:none}
.lcdhint{font-size:.68rem; color:var(--lcd-dim); text-align:right; margin-top:5px}

/* Settings */
.ctrl{display:flex; flex-direction:column; gap:8px}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.lbl{font-size:.78rem; color:var(--muted); min-width:2.8em}
.chip{
  font:inherit; font-size:.86rem; padding:6px 11px; min-height:36px; border-radius:7px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; touch-action:manipulation;
}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.hint{margin:0; font-size:.8rem; color:var(--muted)}
select{font:inherit; font-size:.86rem; padding:6px 8px; min-height:36px; border-radius:7px; border:1px solid var(--line); background:var(--panel); color:var(--ink)}
input[type="range"]{accent-color:var(--accent); flex:1; min-width:0}
input[type="checkbox"]{accent-color:var(--accent); width:18px; height:18px; margin:0}
.sw{display:flex; align-items:center; gap:8px; font-size:.9rem; cursor:pointer}
.status{font-size:.78rem; color:var(--muted); min-width:0; flex:1}

/* Keypad */
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; touch-action:none}
.key{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:clamp(64px,11vh,96px); border:0; border-radius:12px; padding:0;
  background:var(--kb); color:var(--ki); font:inherit;
  box-shadow:0 3px 0 var(--ke), inset 0 0 0 1px var(--line), 0 7px 10px -6px var(--shadow-c);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; cursor:pointer;
}
.key .d{font-size:1.9rem; font-weight:600; line-height:1}
.key .s{font-size:.74rem; letter-spacing:.06em; min-height:1.1em; opacity:.85}
.key.nat{--kb:var(--nat); --ki:var(--nat-ink); --ke:var(--nat-edge)}
.key.shp{--kb:var(--shp); --ki:var(--shp-ink); --ke:var(--shp-edge)}
.key.hi{--kb:var(--hi); --ki:var(--hi-ink); --ke:var(--hi-edge)}
.key.mod{--kb:var(--mod); --ki:var(--mod-ink); --ke:var(--mod-edge)}
.key.down{
  background:var(--accent); color:var(--accent-ink); transform:translateY(3px);
  box-shadow:0 0 0 var(--accent-edge), inset 0 0 0 1px var(--accent-edge), 0 3px 6px -4px var(--shadow-c);
}
.key.target{outline:3px solid var(--accent); outline-offset:2px}
.key:focus-visible,.chip:focus-visible,.octbtn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .key.target{animation:nudge 1.1s ease-in-out infinite}
  @keyframes nudge{50%{outline-offset:6px}}
}

/* Octave bar */
.octbar{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center}
.octbtn{
  font:inherit; font-size:.95rem; font-weight:600; min-height:60px; border:0; border-radius:10px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:var(--mod); color:var(--mod-ink); cursor:pointer; touch-action:none;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  box-shadow:0 3px 0 var(--mod-edge), inset 0 0 0 1px var(--line); -webkit-tap-highlight-color:transparent;
}
.octbtn small{font-size:.7rem; font-weight:500; letter-spacing:.06em; opacity:.75}
.octbtn.held{
  background:var(--accent); color:var(--accent-ink); transform:translateY(3px);
  box-shadow:0 0 0 var(--accent-edge), inset 0 0 0 1px var(--accent-edge);
}
.octbtn.held small{opacity:1}
.octmid.shifted b{color:var(--accent)}
.octrow span.base:not(.on){box-shadow:inset 0 0 0 2px var(--lcd-ink); color:var(--lcd-ink)}
.octmid{text-align:center; font-family:var(--f-lcd); font-size:.78rem; color:var(--muted); line-height:1.35; min-width:6em}
.octmid b{display:block; font-size:1.3rem; color:var(--ink); font-weight:500}
.app[data-voice="dtmf"] .octbar,.app[data-voice="dtmf"] .octrow{opacity:.4}

.extras{display:flex; flex-direction:column; gap:10px; padding:10px 12px; background:var(--panel); border-radius:10px; box-shadow:inset 0 0 0 1px var(--line)}
</style>

<div class="app" id="app" data-voice="piano">
  <header><h1>拨号琴</h1><span>电话键盘钢琴 · 原型</span></header>

  <div class="lcd" id="lcd">
    <div class="dial" id="dial">&nbsp;</div>
    <div class="note dim" id="note">点任意键开始</div>
    <div class="octrow" id="octrow"></div>
    <div class="lcdhint">↕ 在显示屏上划动切换基准八度</div>
  </div>

  <section class="ctrl" aria-label="音色与键位">
    <div class="row">
      <span class="lbl">音色</span>
      <button type="button" class="chip" data-voice="piano" aria-pressed="true">钢琴</button>
      <button type="button" class="chip" data-voice="organ" aria-pressed="false">电子琴</button>
      <button type="button" class="chip" data-voice="chip" aria-pressed="false">8-bit</button>
      <button type="button" class="chip" data-voice="dtmf" aria-pressed="false">拨号音</button>
    </div>
    <div class="row">
      <span class="lbl">键位</span>
      <button type="button" class="chip" data-mode="orig" aria-pressed="true">原始映射</button>
      <button type="button" class="chip" data-mode="sharp" aria-pressed="false">升号键</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <div class="pad" id="pad" role="group" aria-label="电话键盘"></div>

  <div class="octbar">
    <button type="button" class="octbtn" id="octDn" aria-pressed="false"><span>▼ 低八度</span><small>按住生效</small></button>
    <div class="octmid" id="octmid"><b>C4</b><span>1 = 261.6 Hz</span></div>
    <button type="button" class="octbtn" id="octUp" aria-pressed="false"><span>▲ 高八度</span><small>按住生效</small></button>
  </div>

  <section class="extras" aria-label="更多">
    <div class="row">
      <label class="sw"><input type="checkbox" id="shakeOn"> 甩动换八度</label>
      <span class="status" id="shakeSt">向上甩升基准八度，向下甩降基准八度</span>
    </div>
    <div class="row" id="sensRow" hidden>
      <label class="lbl" for="sens">灵敏度</label>
      <input type="range" id="sens" min="10" max="30" value="22">
    </div>
    <div class="row">
      <label class="lbl" for="song">跟弹</label>
      <select id="song">
        <option value="">关闭</option>
        <option value="twinkle">小星星</option>
        <option value="ode">欢乐颂</option>
      </select>
      <span class="status" id="prog"></span>
    </div>
  </section>
</div>

<script>
(function(){
  var KEYS=['1','2','3','4','5','6','7','8','9','*','0','#'];
  var NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  var FLATS=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
  // original mapping: semitones above C for each key
  var ORIG={'1':0,'2':2,'3':4,'4':5,'5':7,'6':9,'7':11,'8':1,'9':3,'0':6,'*':8,'#':10};
  // sharp-key mapping: 1-7 natural, 8/9/0 = high 1/2/3 (next octave); * and # are held modifiers
  var NAT={'1':0,'2':2,'3':4,'4':5,'5':7,'6':9,'7':11,'8':12,'9':14,'0':16};
  var DTMF={'1':[697,1209],'2':[697,1336],'3':[697,1477],'4':[770,1209],'5':[770,1336],'6':[770,1477],
            '7':[852,1209],'8':[852,1336],'9':[852,1477],'*':[941,1209],'0':[941,1336],'#':[941,1477]};
  var LETTERS={'1':'','2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO','7':'PQRS','8':'TUV','9':'WXYZ','*':'','0':'','#':''};
  var SONGS={
    twinkle:['1','1','5','5','6','6','5','4','4','3','3','2','2','1'],
    ode:['3','3','4','5','5','4','3','2','1','1','2','3','3','2','2']
  };
  var HINTS={
    orig:'1–7 是简谱 do–si（浅色键），8 9 0 * # 依次是 C♯ D♯ F♯ G♯ A♯（深色键）。',
    sharp:'1–7 是简谱；按住 * 升半音，按住 # 降半音；8 9 0 是高音 1 2 3。',
    dtmf:'拨号音模式：每个键发出真实电话的双音（DTMF），没有音高，字母和真手机一样。'
  };

  function load(k,d){try{var v=localStorage.getItem('dialpiano.'+k);return v==null?d:v}catch(e){return d}}
  function save(k,v){try{localStorage.setItem('dialpiano.'+k,v)}catch(e){}}

  var state={mode:load('mode','orig'),voice:load('voice','piano'),oct:4,sharp:0,flat:0,dial:'',last:'',song:'',idx:0};
  // state.oct is the base octave (swipe / shake); the ▲▼ buttons only shift it while held
  var octHold={up:new Set(),dn:new Set()};
  if(state.mode!=='orig'&&state.mode!=='sharp')state.mode='orig';
  if(['piano','organ','chip','dtmf'].indexOf(state.voice)<0)state.voice='piano';

  var $=function(s){return document.querySelector(s)};
  var app=$('#app'),pad=$('#pad'),lcd=$('#lcd'),elDial=$('#dial'),elNote=$('#note'),elOct=$('#octrow'),
      elHint=$('#hint'),elMid=$('#octmid'),elProg=$('#prog'),elShakeSt=$('#shakeSt');

  /* ---------- audio ---------- */
  var ctx=null,master=null;
  function ensureAudio(){
    try{
      if(!ctx){
        var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
        try{ctx=new AC({latencyHint:'interactive'})}catch(e){ctx=new AC()}
        var comp=ctx.createDynamicsCompressor();
        master=ctx.createGain(); master.gain.value=0.9;
        master.connect(comp); comp.connect(ctx.destination);
      }
      if(ctx.state!=='running')ctx.resume();
    }catch(e){}
  }
  ['pointerup','touchend','click','keydown'].forEach(function(ev){document.addEventListener(ev,ensureAudio,{passive:true})});

  function mtof(m){return 440*Math.pow(2,(m-69)/12)}

  function startVoice(type,arg){
    var t=ctx.currentTime, out=ctx.createGain(), oscs=[], rel=0.1;
    out.gain.setValueAtTime(0,t); out.connect(master);
    function add(wave,f,g,dest,det){
      var o=ctx.createOscillator(); o.type=wave; o.frequency.setValueAtTime(f,t); if(det)o.detune.value=det;
      var gn=ctx.createGain(); gn.gain.value=g; o.connect(gn); gn.connect(dest); o.start(t); oscs.push(o);
    }
    if(type==='piano'){
      var f=mtof(arg), dur=Math.max(0.9,Math.min(3.4,3.4-(arg-48)*0.045));
      [[1,1],[2,0.5],[3,0.26],[4,0.14],[5,0.07]].forEach(function(p){add('sine',f*p[0]*(1+0.0005*p[0]*p[0]),p[1],out)});
      out.gain.linearRampToValueAtTime(0.17,t+0.004);
      out.gain.exponentialRampToValueAtTime(0.0008,t+dur);
      oscs.forEach(function(o){o.stop(t+dur+0.05)});
      rel=0.14;
    }else if(type==='organ'){
      var f2=mtof(arg), lp=ctx.createBiquadFilter();
      lp.type='lowpass'; lp.frequency.value=2600; lp.Q.value=0.6; lp.connect(out);
      add('triangle',f2,1,lp); add('sine',f2*2,0.35,lp); add('square',f2,0.12,lp,7); add('sine',f2/2,0.3,lp);
      out.gain.linearRampToValueAtTime(0.16,t+0.012); rel=0.12;
    }else if(type==='chip'){
      add('square',mtof(arg),1,out);
      out.gain.linearRampToValueAtTime(0.09,t+0.002); rel=0.03;
    }else{
      add('sine',arg[0],1,out); add('sine',arg[1],1,out);
      out.gain.linearRampToValueAtTime(0.11,t+0.004); rel=0.03;
    }
    return {out:out,oscs:oscs,rel:rel};
  }
  function stopVoice(v){
    try{
      var now=ctx.currentTime,p=v.out.gain;
      if(p.cancelAndHoldAtTime){p.cancelAndHoldAtTime(now)}
      else{var c=p.value;p.cancelScheduledValues(now);p.setValueAtTime(c,now)}
      p.setTargetAtTime(0,now,v.rel/3);
      var end=now+v.rel+0.08;
      v.oscs.forEach(function(o){try{o.stop(end)}catch(e){}});
      v.oscs[0].onended=function(){try{v.out.disconnect()}catch(e){}};
    }catch(e){}
  }

  /* ---------- notes ---------- */
  function semi(k){
    if(state.mode==='orig')return ORIG[k];
    return NAT[k]+(state.sharp>0?1:0)-(state.flat>0?1:0);
  }
  function preferFlat(){return state.flat>0&&state.sharp===0}
  function nameSemi(s){return (preferFlat()?FLATS:NAMES)[((s%12)+12)%12]}
  function nameMidi(m){return nameSemi(m)+(Math.floor(m/12)-1)}

  /* ---------- keypad ---------- */
  var keyEl={},subEl={},downCount={};
  KEYS.forEach(function(k){
    var b=document.createElement('button');
    b.type='button'; b.className='key nat'; b.dataset.k=k;
    b.innerHTML='<span class="d"></span><span class="s"></span>';
    b.querySelector('.d').textContent=k;
    pad.appendChild(b); keyEl[k]=b; subEl[k]=b.querySelector('.s'); downCount[k]=0;
  });
  for(var n=2;n<=6;n++){var sp=document.createElement('span');sp.textContent='C'+n;sp.dataset.o=n;elOct.appendChild(sp)}

  function refreshLabels(){
    var dtmf=state.voice==='dtmf';
    KEYS.forEach(function(k){
      var el=keyEl[k],cls,sub;
      if(dtmf){cls='nat';sub=LETTERS[k]}
      else if(state.mode==='orig'){cls='1234567'.indexOf(k)>=0?'nat':'shp';sub=NAMES[ORIG[k]]}
      else if(k==='*'){cls='mod';sub='♯ 按住'}
      else if(k==='#'){cls='mod';sub='♭ 按住'}
      else{var hiKey=(k==='8'||k==='9'||k==='0');cls=hiKey?'hi':'nat';sub=nameSemi(semi(k))+(hiKey?'↑':'')}
      el.classList.remove('nat','shp','hi','mod'); el.classList.add(cls);
      subEl[k].textContent=sub;
      el.setAttribute('aria-label',k+(sub?' '+sub:''));
    });
    elHint.textContent=dtmf?HINTS.dtmf:HINTS[state.mode];
  }

  function curOct(){
    var d=(octHold.up.size?1:0)-(octHold.dn.size?1:0);
    return Math.max(2,Math.min(6,state.oct+d));
  }
  function refreshOct(){
    var o=curOct(),shifted=o!==state.oct;
    Array.prototype.forEach.call(elOct.children,function(s){
      s.classList.toggle('on',+s.dataset.o===o);
      s.classList.toggle('base',shifted&&+s.dataset.o===state.oct);
    });
    var f=mtof((o+1)*12);
    elMid.classList.toggle('shifted',shifted);
    elMid.innerHTML='<b>C'+o+'</b><span>'+(state.voice==='dtmf'?'无音高':(shifted?'临时 · ':'')+'1 = '+f.toFixed(1)+' Hz')+'</span>';
    [['up','#octUp'],['dn','#octDn']].forEach(function(p){
      var b=$(p[1]),h=octHold[p[0]].size>0;
      b.classList.toggle('held',h); b.setAttribute('aria-pressed',String(h));
    });
  }
  function setOct(o){
    o=Math.max(2,Math.min(6,o));
    if(o===state.oct)return false;
    state.oct=o; refreshOct(); return true;
  }

  var active=new Map();
  function render(){
    elDial.textContent=state.dial.slice(-14)||' ';
    var names=[];
    active.forEach(function(e){if(!e.mod)names.push(e.nm)});
    if(names.length){elNote.textContent=names.join(' ');elNote.classList.remove('dim')}
    else if(state.last){elNote.textContent=state.last;elNote.classList.add('dim')}
    elNote.classList.toggle('many',names.length>3);
  }
  function setDown(k,d){
    downCount[k]=Math.max(0,downCount[k]+d);
    keyEl[k].classList.toggle('down',downCount[k]>0);
  }

  /* ---------- follow-along ---------- */
  function refreshFollow(){
    KEYS.forEach(function(k){keyEl[k].classList.remove('target')});
    var s=SONGS[state.song];
    if(!s){elProg.textContent='';return}
    var k=s[state.idx];
    keyEl[k].classList.add('target');
    elProg.textContent='下一个：'+k+'（'+(state.idx+1)+'/'+s.length+'）';
  }
  function followCheck(k){
    var s=SONGS[state.song]; if(!s)return;
    if(k===s[state.idx]){
      state.idx++;
      if(state.idx>=s.length){state.idx=0;refreshFollow();elProg.textContent='弹完了，再来一遍';return}
      refreshFollow();
    }
  }

  /* ---------- press / release ---------- */
  function press(k,id){
    if(active.has(id))return;
    ensureAudio();
    var dtmf=state.voice==='dtmf';
    var isMod=!dtmf&&state.mode==='sharp'&&(k==='*'||k==='#');
    setDown(k,1);
    state.dial+=k;
    if(isMod){
      if(k==='*')state.sharp++; else state.flat++;
      active.set(id,{k:k,mod:true});
      refreshLabels(); render(); return;
    }
    var entry={k:k};
    if(ctx&&master){
      if(dtmf){entry.voice=startVoice('dtmf',DTMF[k]);entry.nm=DTMF[k][0]+'+'+DTMF[k][1]}
      else{
        var midi=(curOct()+1)*12+semi(k);
        entry.voice=startVoice(state.voice,midi);
        entry.nm=nameMidi(midi);
      }
    }else{entry.nm=k}
    state.last=entry.nm;
    active.set(id,entry);
    if(navigator.vibrate){try{navigator.vibrate(6)}catch(e){}}
    followCheck(k);
    render();
  }
  function releaseId(id){
    var en=active.get(id); if(!en)return;
    active.delete(id);
    setDown(en.k,-1);
    if(en.mod){
      if(en.k==='*')state.sharp=Math.max(0,state.sharp-1); else state.flat=Math.max(0,state.flat-1);
      refreshLabels();
    }else if(en.voice){stopVoice(en.voice)}
    render();
  }
  function releaseAll(){
    Array.from(active.keys()).forEach(releaseId);
    octHold.up.clear(); octHold.dn.clear(); refreshOct();
  }

  pad.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    var el=e.target.closest('.key'); if(!el)return;
    e.preventDefault();
    press(el.dataset.k,'p'+e.pointerId);
    try{el.setPointerCapture(e.pointerId)}catch(err){}
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
    pad.addEventListener(ev,function(e){releaseId('p'+e.pointerId)});
  });
  pad.addEventListener('contextmenu',function(e){e.preventDefault()});

  document.addEventListener('keydown',function(e){
    if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
    var t=e.target; if(t&&/^(SELECT|INPUT|TEXTAREA)$/.test(t.tagName))return;
    if(KEYS.indexOf(e.key)>=0){e.preventDefault();press(e.key,'k'+e.key)}
    else if(e.key==='ArrowUp'){e.preventDefault();holdOct('up','kU',true)}
    else if(e.key==='ArrowDown'){e.preventDefault();holdOct('dn','kD',true)}
  });
  document.addEventListener('keyup',function(e){
    if(e.key==='ArrowUp'){holdOct('up','kU',false);return}
    if(e.key==='ArrowDown'){holdOct('dn','kD',false);return}
    if(e.key==='Shift'){releaseId('k*');releaseId('k#')}
    else if(e.key==='8')releaseId('k*');
    else if(e.key==='3')releaseId('k#');
    else if(KEYS.indexOf(e.key)>=0)releaseId('k'+e.key);
  });
  window.addEventListener('blur',releaseAll);
  document.addEventListener('visibilitychange',function(){if(document.hidden)releaseAll()});

  /* ---------- octave controls ---------- */
  // momentary: the shift applies only while the button is held, then falls back to the base octave
  function holdOct(dir,id,on){
    var s=octHold[dir];
    if(on){if(s.has(id))return;s.add(id)}else{if(!s.delete(id))return}
    refreshOct();
  }
  [['up','#octUp'],['dn','#octDn']].forEach(function(p){
    var b=$(p[1]),dir=p[0];
    b.addEventListener('pointerdown',function(e){
      if(e.button>0)return;
      e.preventDefault(); ensureAudio();
      holdOct(dir,'p'+e.pointerId,true);
      try{b.setPointerCapture(e.pointerId)}catch(err){}
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
      b.addEventListener(ev,function(e){holdOct(dir,'p'+e.pointerId,false)});
    });
    b.addEventListener('contextmenu',function(e){e.preventDefault()});
    b.addEventListener('keydown',function(e){
      if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();e.stopPropagation();holdOct(dir,'b',true)}
    });
    b.addEventListener('keyup',function(e){
      if(e.key===' '||e.key==='Enter'){e.preventDefault();holdOct(dir,'b',false)}
    });
    b.addEventListener('blur',function(){holdOct(dir,'b',false)});
  });

  var sw=null;
  lcd.addEventListener('pointerdown',function(e){sw={x:e.clientX,y:e.clientY};try{lcd.setPointerCapture(e.pointerId)}catch(err){}});
  lcd.addEventListener('pointerup',function(e){
    if(!sw)return;
    var dx=e.clientX-sw.x,dy=e.clientY-sw.y; sw=null;
    if(Math.abs(dy)>30&&Math.abs(dy)>Math.abs(dx)*1.5)setOct(state.oct+(dy<0?1:-1));
  });
  lcd.addEventListener('pointercancel',function(){sw=null});

  /* ---------- shake (device motion) ---------- */
  var shake={on:false,got:false,init:false,g:[0,0,0],last:0,warm:0,thr:14};
  var chk=$('#shakeOn'),sens=$('#sens'),sensRow=$('#sensRow');
  var IDLE='向上甩升基准八度，向下甩降基准八度';
  function onMotion(e){
    var ag=e.accelerationIncludingGravity;
    if(!ag||ag.x==null)return;
    shake.got=true;
    var now=performance.now();
    if(!shake.init){shake.g=[ag.x,ag.y,ag.z];shake.init=true;shake.warm=now+500;elShakeSt.textContent='已就绪：'+IDLE;return}
    var g=shake.g;
    g[0]=g[0]*0.96+ag.x*0.04; g[1]=g[1]*0.96+ag.y*0.04; g[2]=g[2]*0.96+ag.z*0.04;
    if(now<shake.warm||now-shake.last<700)return;
    var gm=Math.sqrt(g[0]*g[0]+g[1]*g[1]+g[2]*g[2])||1;
    // linear acceleration projected on the gravity axis; sign-convention independent
    var up=((ag.x-g[0])*g[0]+(ag.y-g[1])*g[1]+(ag.z-g[2])*g[2])/gm;
    if(up>shake.thr){shake.last=now;setOct(state.oct+1)}
    else if(up<-shake.thr){shake.last=now;setOct(state.oct-1)}
  }
  function setThr(){shake.thr=36-(+sens.value)}
  sens.addEventListener('input',function(){setThr();save('sens',sens.value)});
  var savedSens=load('sens','22'); if(+savedSens>=10&&+savedSens<=30)sens.value=savedSens;
  setThr();
  chk.addEventListener('change',function(){
    if(!chk.checked){
      window.removeEventListener('devicemotion',onMotion);
      shake.on=false;shake.init=false;sensRow.hidden=true;elShakeSt.textContent=IDLE;return;
    }
    var p=Promise.resolve('granted');
    try{
      if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
        p=DeviceMotionEvent.requestPermission();
      }
    }catch(err){p=Promise.reject(err)}
    p.then(function(r){
      if(r!=='granted'){chk.checked=false;elShakeSt.textContent='没有拿到传感器权限';return}
      window.addEventListener('devicemotion',onMotion);
      shake.on=true;shake.got=false;shake.init=false;sensRow.hidden=false;
      elShakeSt.textContent='等待传感器…';
      setTimeout(function(){
        if(shake.on&&!shake.got)elShakeSt.textContent='这里读不到手机传感器。请用 ▲▼ 按钮，或在显示屏上划动。';
      },2500);
    }).catch(function(){
      chk.checked=false;elShakeSt.textContent='这里读不到手机传感器。请用 ▲▼ 按钮，或在显示屏上划动。';
    });
  });

  /* ---------- chips & select ---------- */
  function syncChips(){
    document.querySelectorAll('.chip[data-voice]').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.voice===state.voice))});
    document.querySelectorAll('.chip[data-mode]').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.mode===state.mode))});
    app.dataset.voice=state.voice;
  }
  document.querySelectorAll('.chip[data-voice]').forEach(function(c){
    c.addEventListener('click',function(){state.voice=c.dataset.voice;save('voice',state.voice);syncChips();refreshLabels();refreshOct()});
  });
  document.querySelectorAll('.chip[data-mode]').forEach(function(c){
    c.addEventListener('click',function(){state.mode=c.dataset.mode;save('mode',state.mode);syncChips();refreshLabels()});
  });
  $('#song').addEventListener('change',function(e){state.song=e.target.value;state.idx=0;refreshFollow()});

  syncChips(); refreshLabels(); refreshOct(); refreshFollow();
})();
</script>

</body></html>
