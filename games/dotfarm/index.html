<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dot Farm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="title">🌱 Dot Farm</div>
    <span class="debug-badge">⚡ x60</span>
    <div class="coins">🪙 <span id="coin-count">0</span></div>
  </header>

  <main>
    <div class="field" id="field"></div>
  </main>

  <footer id="toolbar"></footer>
</div>

<!-- Shop window -->
<div class="window grid-window" id="shop-window">
  <div class="window-title">
    <span>🛒 Shop</span>
    <button class="window-close" id="shop-close" aria-label="Close">✖</button>
  </div>
  <div class="window-body">
    <div class="slot-grid" id="shop-items"></div>
    <div class="shop-hint">Drag items onto your field!</div>
  </div>
</div>

<!-- Market window -->
<div class="window" id="market-window">
  <div class="window-title">
    <span>💰 Market</span>
    <button class="window-close" id="market-close" aria-label="Close">✖</button>
  </div>
  <div class="window-body">
    <div class="market-head"><span>We buy</span><span>Price</span></div>
    <div id="market-items"></div>
    <div class="shop-hint">Drag ripe crops here to sell!</div>
  </div>
</div>

<!-- Build window -->
<div class="window grid-window" id="build-window">
  <div class="window-title">
    <span>🔨 Build</span>
    <button class="window-close" id="build-close" aria-label="Close">✖</button>
  </div>
  <div class="window-body">
    <div class="slot-grid" id="build-items"></div>
    <div class="shop-hint">Drag a building onto empty tiles!</div>
  </div>
</div>

<!-- Storage window -->
<div class="window grid-window" id="storage-window">
  <div class="window-title">
    <span>📦 Storage</span>
    <button class="window-close" id="storage-close" aria-label="Close">✖</button>
  </div>
  <div class="window-body">
    <div class="slot-grid" id="storage-items"></div>
    <div class="shop-hint" id="storage-hint"></div>
  </div>
</div>

<div class="tile-menu" id="tile-menu"></div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/farming.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
